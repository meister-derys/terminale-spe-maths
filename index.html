n effectif à un pourcentage",r:[`Pourcentage = ${FX("effectif","effectif total")} × 100.`,"Dans un tableau croisé, on repère bien le total qui sert de référence : celui de tout le tableau, ou celui d’une ligne."],x:[["5 élèves sur 20 ont eu au moins 4. Quel pourcentage ?",[`${FX(5,20)} = 0,25 = 25${NB}%.`]],["Sur 400 personnes, 92 ont moins de 30 ans et ne font pas de sport. Quel pourcentage des personnes interrogées ?",[`${FX(92,400)} = 0,23 = 23${NB}%.`]],[`Dans un groupe de 40 personnes, 75${NB}% jouent d’un instrument. Combien de personnes ?`,[`${FX(75,100)} × 40 = 30 personnes.`]]]}],p:`Ne pas confondre l’effectif (un nombre de personnes) et le pourcentage : 5 élèves sur 20, c’est 25${NB}%, pas 5${NB}%.`},a02:{parts:[{t:"Longueurs, masses, contenances",r:["Tableau : km, hm, dam, m, dm, cm, mm (de même avec g et L). Chaque unité vaut 10 fois la suivante.","Vers une unité plus petite, on multiplie ; vers une plus grande, on divise. Un rang = ×10 ou ÷10."],x:[[`3,61${NB}m = … cm`,[`De m à cm : 2 rangs vers la droite, × 100 : 361${NB}cm.`]],[`250${NB}g = … kg`,[`De g à kg : 3 rangs vers la gauche, ÷ 1${NN}000 : 0,25${NB}kg.`]],[`4,5${NB}cL = … mL`,[`× 10 : 45${NB}mL.`]]]},{t:"Aires et volumes",r:["Aires (m², dm², cm²…) : chaque unité vaut 100 fois la suivante (deux colonnes par unité).",`Volumes (m³, dm³, cm³…) : 1${NN}000 fois la suivante (trois colonnes).`,`À retenir : 1${NB}L = 1${NB}dm³, 1${NB}mL = 1${NB}cm³, 1${NB}m³ = 1${NN}000${NB}L.`],x:[[`0,79${NB}dm² = … cm²`,[`× 100 : 79${NB}cm².`]],[`10,435${NB}L = … dm³`,[`1${NB}L = 1${NB}dm³ : 10,435${NB}dm³.`]],[`2,5${NB}m³ = … L`,[`× 1${NN}000 : 2${NN}500${NB}L.`]]]},{t:"Durées",r:[`1${NB}h = 60${NB}min. Pour passer des heures aux minutes, on multiplie par 60 ; dans l’autre sens, on divise par 60.`],x:[[`1,5${NB}h = … min`,[`1,5 × 60 = 90${NB}min.`]],[`2${NB}h${NB}15${NB}min en heures ?`,[`15${NB}min = ${FX(15,60)}${NB}h = 0,25${NB}h, donc 2,25${NB}h.`]]]}],p:`1${NB}h${NB}30${NB}min ne s’écrit pas 1,30${NB}h mais 1,5${NB}h : une heure compte 60 minutes, pas 100.`},a04:{parts:[{t:"Avec une formule",r:["L’image de a par f est f(a) : on remplace x par a dans la formule.","Un antécédent de b est un nombre x tel que f(x) = b : on résout l’équation f(x) = b."],x:[[`f(x) = 2x<sup>2</sup> ${MINUS} 3. Image de ${MINUS}2 ?`,[`f(${MINUS}2) = 2 × (${MINUS}2)<sup>2</sup> ${MINUS} 3 = 2 × 4 ${MINUS} 3 = 5.`]],["f(x) = 4x + 5. Antécédent de 0 ?",[`4x + 5 = 0, donc x = ${MINUS}${FX(5,4)}.`]],["f(x) = x<sup>2</sup>. Antécédents de 25 ?",[`5 et ${MINUS}5, car 5<sup>2</sup> = (${MINUS}5)<sup>2</sup> = 25. Le nombre ${MINUS}4 n’a pas d’antécédent : un carré n’est jamais négatif.`]]]},{t:"Sur une courbe",r:["Image de a : on part de a sur l’axe des abscisses, on monte (ou descend) jusqu’à la courbe, on lit l’ordonnée.","Antécédents de b : on part de b sur l’axe des ordonnées, on trace l’horizontale, on lit les abscisses de tous les points d’intersection."],x:[["Lire f(2) et les antécédents de 1.",[figC([-4,-2,-1,1,2,4,5],[-2,1,3,1,-3,1,4]),`f(2) = ${MINUS}3.`,`La droite y = 1 coupe la courbe trois fois : les antécédents de 1 sont ${MINUS}2, 1 et 4.`]]]}],p:"Un nombre a une seule image, mais il peut avoir plusieurs antécédents, ou aucun : il faut tous les donner."},a10:{m:["Un point appartient à une courbe d’équation y = f(x) si ses coordonnées vérifient l’équation.","Abscisse connue : on remplace x dans l’équation pour obtenir l’ordonnée.","Ordonnée connue : on résout l’équation f(x) = cette ordonnée pour obtenir l’abscisse.","Sur l’axe des ordonnées, x = 0 ; sur l’axe des abscisses, y = 0."],x:[[`A, d’abscisse ${MINUS}2, est sur la courbe d’équation y = x<sup>2</sup> + 3x ${MINUS} 1. Ordonnée de A ?`,[`y = (${MINUS}2)<sup>2</sup> + 3 × (${MINUS}2) ${MINUS} 1 = 4 ${MINUS} 6 ${MINUS} 1 = ${MINUS}3.`]],[`B, d’ordonnée ${MINUS}2, est sur la droite y = ${MINUS}3x ${MINUS} 8. Abscisse de B ?`,[`${MINUS}3x ${MINUS} 8 = ${MINUS}2, donc ${MINUS}3x = 6 et x = ${MINUS}2.`]],[`Où la courbe y = 2x<sup>2</sup> ${MINUS} x + 7 coupe-t-elle l’axe des ordonnées ?`,[`x = 0 donne y = 7 : au point (0${NB}; 7).`]]],p:`Le carré d’un nombre négatif est positif : (${MINUS}2)<sup>2</sup> = 4, alors que ${MINUS}2<sup>2</sup> = ${MINUS}4.`},a12:{m:["On parcourt la courbe de gauche à droite : quand elle monte, f est croissante (flèche ↗) ; quand elle descend, f est décroissante (flèche ↘).","Dans la première ligne du tableau, on écrit les bornes de l’ensemble de définition et les abscisses où le sens change.","Dans la seconde ligne, on écrit les valeurs lues (en haut pour un maximum, en bas pour un minimum) et les flèches."],x:[[`Dresser le tableau de variations de f sur [${MINUS}4${NB}; 5].`,[figC([-4,-1,3,5],[-2,4,-3,1]),`<div>${varTable([-4,-1,3,5],[-2,4,-3,1])}</div>`,`Le maximum est 4, atteint en x = ${MINUS}1 ; le minimum est ${MINUS}3, atteint en x = 3.`]],["Sur quel intervalle cette fonction est-elle décroissante ?",[`La courbe descend de x = ${MINUS}1 à x = 3 : f est décroissante sur [${MINUS}1${NB}; 3].`]]],p:"Dans le tableau, on écrit des abscisses sur la ligne de x et des ordonnées sur la ligne de f : ne pas les mélanger."},a13:{m:["Résoudre graphiquement f(x) = k, c’est chercher les abscisses des points de la courbe qui ont pour ordonnée k.","On trace la droite horizontale y = k, puis on lit l’abscisse de chaque point d’intersection.","f(x) = 0 : ce sont les points où la courbe coupe l’axe des abscisses."],x:[["Résoudre f(x) = 1 et f(x) = 5.",[figC([-5,-4,-2,0,2,4,5],[-3,1,4,1,-1,1,3]),`La droite y = 1 coupe la courbe en trois points, d’abscisses ${MINUS}4, 0 et 4 : S = {${MINUS}4${NB}; 0${NB}; 4}.`,"La droite y = 5 ne coupe pas la courbe : pas de solution."]],["Avec la même courbe, résoudre f(x) = 4.",[`La droite y = 4 touche la courbe en un seul point, son sommet d’abscisse ${MINUS}2 : S = {${MINUS}2}.`]]],p:"On donne des abscisses (des x), pas des ordonnées. Et il faut toutes les donner."},a14:{m:["f(x) > k : on garde les abscisses des points de la courbe situés au-dessus de la droite y = k. f(x) < k : au-dessous.","On écrit la réponse sous forme d’intervalle(s). Avec ≥ ou ≤, les bornes où f(x) = k sont incluses (crochet tourné vers l’intérieur) ; avec > ou <, elles sont exclues.","Les bornes de l’ensemble de définition sont incluses si elles conviennent. Plusieurs intervalles se relient par le symbole ∪ (union)."],x:[[`f est définie sur [${MINUS}4${NB}; 6]. f(x) = 1 pour x = ${MINUS}2, x = 3 et x = 5, et la courbe est au-dessus de y = 1 entre ${MINUS}2 et 3, puis entre 5 et 6. Résoudre f(x) > 1.`,[`S = ]${MINUS}2${NB}; 3[ ∪ ]5${NB}; 6].`]],["Même fonction : résoudre f(x) ≤ 1.",[`S = [${MINUS}4${NB}; ${MINUS}2] ∪ [3${NB}; 5].`]]],p:"Au clavier : [ ] pour les crochets, le point-virgule entre les bornes, ∪ entre deux intervalles."},a15:{m:["f(x) est positif quand la courbe est au-dessus de l’axe des abscisses, négatif quand elle est au-dessous, nul quand elle le coupe.","Première ligne du tableau : les bornes et les valeurs où f(x) = 0. Seconde ligne : un 0 sous chaque valeur où f s’annule, et le signe entre deux."],x:[[`Tableau de signes de f sur [${MINUS}3${NB}; 4].`,[figC([-3,-1,0,2,4],[2,0,-2,0,3]),`<div>${sigTable(["−3","−1","2","4"],["+",MINUS,"+"],"f(x)")}</div>`]],["Quel est le signe de f(1) ?",["En x = 1, la courbe est au-dessous de l’axe des abscisses : f(1) est négatif."]]],p:"On regarde la position de la courbe par rapport à l’axe des abscisses, pas si elle monte ou descend : ce serait le tableau de variations."},a20:{m:["De gauche à droite, un diagramme en boîte indique : la valeur minimale, le premier quartile Q<sub>1</sub>, la médiane, le troisième quartile Q<sub>3</sub>, la valeur maximale.",`Étendue = maximum ${MINUS} minimum. Écart interquartile = Q<sub>3</sub> ${MINUS} Q<sub>1</sub>.`,`Au moins 25${NB}% des valeurs sont inférieures ou égales à Q<sub>1</sub>, au moins 50${NB}% à la médiane, au moins 75${NB}% à Q<sub>3</sub>.`],x:[["Lire les indicateurs.",[FB(boxFig([2,4,6,10,13],0,14,1)),"Minimum 2, Q<sub>1</sub> = 4, médiane 6, Q<sub>3</sub> = 10, maximum 13.",`Étendue : 13 ${MINUS} 2 = 11. Écart interquartile : 10 ${MINUS} 4 = 6.`,`Au moins 75${NB}% des valeurs sont supérieures ou égales à 4.`]],["Au moins quel pourcentage des valeurs est inférieur ou égal à 10 ?",[`10 est le troisième quartile : au moins 75${NB}%.`]]],p:"La médiane n’est pas forcément au milieu de la boîte."},a30:{parts:[{t:"Facteur commun",r:["Factoriser, c’est transformer une somme en produit : ka + kb = k(a + b).","On repère le facteur commun (un nombre, x, ou une parenthèse), puis on écrit ce qui reste de chaque terme."],x:[[`Factoriser x<sup>2</sup> ${MINUS} 7x.`,[`x × x ${MINUS} x × 7 = x(x ${MINUS} 7).`]],["Factoriser 6x + 15.",["3 × 2x + 3 × 5 = 3(2x + 5)."]],[`Factoriser (x ${MINUS} 2)(3x + 1) ${MINUS} 4(x ${MINUS} 2).`,[`Facteur commun (x ${MINUS} 2) : (x ${MINUS} 2)[(3x + 1) ${MINUS} 4] = (x ${MINUS} 2)(3x ${MINUS} 3).`]]]},{t:"Identités remarquables",r:[`a<sup>2</sup> ${MINUS} b<sup>2</sup> = (a ${MINUS} b)(a + b).`,`a<sup>2</sup> + 2ab + b<sup>2</sup> = (a + b)<sup>2</sup> et a<sup>2</sup> ${MINUS} 2ab + b<sup>2</sup> = (a ${MINUS} b)<sup>2</sup>.`],x:[[`Factoriser x<sup>2</sup> ${MINUS} 16.`,[`x<sup>2</sup> ${MINUS} 4<sup>2</sup> = (x ${MINUS} 4)(x + 4).`]],[`Factoriser 4x<sup>2</sup> ${MINUS} 9.`,[`(2x)<sup>2</sup> ${MINUS} 3<sup>2</sup> = (2x ${MINUS} 3)(2x + 3).`]],[`Factoriser 9x<sup>2</sup> ${MINUS} 30x + 25.`,[`(3x)<sup>2</sup> ${MINUS} 2 × 3x × 5 + 5<sup>2</sup> = (3x ${MINUS} 5)<sup>2</sup>.`]]]}],p:"On vérifie en redéveloppant : on doit retrouver l’expression de départ."},a33:{m:["Un indice compare une valeur à une valeur de référence, à laquelle on donne l’indice 100.","Les indices sont proportionnels aux valeurs : on peut faire un tableau de proportionnalité (valeurs / indices).",`Indice = ${FX("valeur × 100","valeur de référence")}. Un indice de 120 correspond à une hausse de 20${NB}% depuis la référence ; un indice de 85, à une baisse de 15${NB}%.`],x:[[`Un prix passe de 35${NB}€ (indice 100) à 38,50${NB}€. Indice ?`,[`${FX("38,5 × 100",35)} = 110.`]],[`Chiffre d’affaires 50${NN}000${NB}€ (indice 100), puis indice 120. Nouveau chiffre d’affaires ?`,[`${FX("50 000 × 120",100)} = 60${NN}000${NB}€, soit une hausse de 20${NB}%.`]],[`Un prix passe de 40${NB}€ à 30${NB}€ ; son indice était 80. Nouvel indice ?`,[`${FX("30 × 80",40)} = 60.`]]],p:"Quand la référence n’a pas l’indice 100, on ne peut pas lire directement le taux : on utilise la proportionnalité."},a35:{m:[`Si a > 0 : x<sup>2</sup> = a a deux solutions, ${MINUS}√a et √a.`,"Si a = 0 : une seule solution, 0. Si a < 0 : aucune solution (un carré n’est jamais négatif).","Pour kx<sup>2</sup> = m, on divise d’abord par k. Pour (x + b)<sup>2</sup> = c, on pose X = x + b."],x:[["Résoudre x<sup>2</sup> = 16.",[`x = ${MINUS}4 ou x = 4.`]],["Résoudre 2x<sup>2</sup> = 8.",[`x<sup>2</sup> = 4, donc x = ${MINUS}2 ou x = 2.`]],[`Résoudre x<sup>2</sup> = ${MINUS}5.`,["Aucune solution."]],["Résoudre (x + 1)<sup>2</sup> = 16.",[`x + 1 = 4 ou x + 1 = ${MINUS}4, donc x = 3 ou x = ${MINUS}5.`]],[`Résoudre x<sup>2</sup> = ${FX(1,4)}.`,[`x = ${MINUS}${FX(1,2)} ou x = ${FX(1,2)}.`]]],p:`Ne pas oublier la solution négative : x<sup>2</sup> = 9 donne x = 3 et x = ${MINUS}3.`},a36:{parts:[{t:"Signe de ax + b",r:[`ax + b s’annule pour x = ${MINUS}${FX("b","a")}.`,`Si a > 0 : signe ${MINUS} puis + ; si a < 0 : signe + puis ${MINUS} (« signe de a à droite du zéro »).`],x:[[`Signe de ${MINUS}2x + 6.`,[`Zéro : x = 3. a = ${MINUS}2 < 0.`,`<div>${sigTable([`${MINUS}∞`,"3","+∞"],["+",MINUS],`${MINUS}2x + 6`)}</div>`]]]},{t:"Signe d’un produit",r:["Une ligne par facteur, avec son zéro et ses signes, puis la règle des signes : un produit de deux nombres de même signe est positif, de signes contraires est négatif."],x:[[`Signe de (x ${MINUS} 1)(x + 3).`,[`Zéros : 1 et ${MINUS}3, rangés dans l’ordre : ${MINUS}3 puis 1.`,`<div>${sigTable([`${MINUS}∞`,`${MINUS}3`,"1","+∞"],["+",MINUS,"+"],"Produit")}</div>`]]]}],p:"Ranger les valeurs de la première ligne dans l’ordre croissant."},a37:{m:["On isole x comme dans une inéquation : on ajoute ou on soustrait le même terme des deux côtés.","Quand on divise ou multiplie par un nombre négatif, le sens de l’inégalité change."],x:[["Isoler x dans 3y + x > 0.",[`x > ${MINUS}3y.`]],[`Isoler x dans 3y ${MINUS} x ≥ 0.`,["3y ≥ x, soit x ≤ 3y."]],["Isoler x dans y ≤ 2x + 6.",[`y ${MINUS} 6 ≤ 2x, donc x ≥ ${FX("y "+MINUS+" 6",2)}.`]],[`Isoler x dans y ≥ 6 ${MINUS} 3x.`,[`3x ≥ 6 ${MINUS} y, donc x ≥ ${FX("6 "+MINUS+" y",3)}.`]]],p:`${MINUS}x < 3y donne x > ${MINUS}3y : multiplier par ${MINUS}1 change le sens.`},a38:{m:[`Le taux d’évolution entre deux dates se calcule avec les indices comme avec les valeurs : t = ${FX("I<sub>2</sub> "+MINUS+" I<sub>1</sub>","I<sub>1</sub>")}.`,"Depuis l’année de base (indice 100), le taux est simplement l’indice moins 100, en pourcentage."],x:[["Indice 113 en 2018, 110 en 2019 (base 100 en 2017). Taux entre 2017 et 2019 ?",[`110 ${MINUS} 100 = 10 : +10${NB}%.`]],["Taux entre 2018 et 2019 ?",[`${FX("110 "+MINUS+" 113",113)} ≈ ${MINUS}0,027, soit environ ${MINUS}2,7${NB}%.`]],["Un indice passe de 150 à 180. Taux ?",[`${FX(30,150)} = 0,2 : +20${NB}%, et non +30${NB}%.`]]],p:"La différence de deux indices n’est un pourcentage que si le premier vaut 100."},a40:{m:[`Une échelle ${FX(1,"n")} signifie : 1${NB}cm sur le plan représente n${NB}cm en réalité.`,`Distance réelle = distance sur le plan × n ; distance sur le plan = ${FX("distance réelle","n")}, les deux dans la même unité.`,`Échelle = ${FX("distance sur le plan","distance réelle")}, en convertissant d’abord dans la même unité.`],x:[[`Plan au ${FX(1,1e3)} : 3,5${NB}cm sur le plan ?`,[`3,5 × 1${NN}000 = 3${NN}500${NB}cm = 35${NB}m.`]],[`Carte au ${FX(1,"50 000")} : 2${NB}km sur la carte ?`,[`2${NB}km = 200${NN}000${NB}cm ; ${FX("200 000","50 000")} = 4${NB}cm.`]],[`8${NB}cm représentent 2${NB}km. Échelle ?`,[`${FX(8,"200 000")} = ${FX(1,"25 000")}.`]]],p:`Toujours convertir d
