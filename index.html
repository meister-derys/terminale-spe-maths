<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Questions de cours</title>
<meta name="theme-color" content="#1d3557">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<style>
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#141b27; --muted:#556075; --line:#d6dde8; --grid:#e1e7f0;
  --accent:#1d4f91; --accent-fg:#ffffff; --accent-soft:#e3ecf8;
  --ok:#17794a; --ok-soft:#dff2e7; --bad:#b0261d; --bad-soft:#fbe5e2;
  --font:"Atkinson Hyperlegible","Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.5 var(--font);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.in{max-width:900px;margin:0 auto}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;align-items:baseline;
  color:var(--muted);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-bottom:18px}
.lead{color:var(--muted);margin-top:8px;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:20px}
.m{font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.2;font-size:.95em}
.fr .n{border-bottom:1.6px solid currentColor;padding:0 .25em .06em}
.fr .d{padding:.06em .25em 0}
sup{font-size:.7em;line-height:0;margin-right:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:18px;min-height:168px;justify-content:space-between}
.card:active{background:var(--accent-soft)}
.card-name{font-size:1.25rem;font-weight:700}
.card-desc{color:var(--muted);font-size:.9rem;line-height:1.4}
.card-ex{align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:1rem;min-height:2.3em;display:inline-flex;align-items:center}
.card.bilan{border-color:var(--accent)}
details.prof{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
details.prof summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details.prof p,details.prof ul{margin-top:10px;color:var(--muted);font-size:.92rem}
details.prof ul{padding-left:1.2em}
details.prof code{background:var(--accent-soft);color:var(--fg);border-radius:5px;padding:1px 6px;font-size:.88em;word-break:break-all}
.back{background:none;border:0;color:var(--accent);padding:10px 0;min-height:44px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:20px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>legend{font-weight:700;font-size:.95rem}
.field input[type=text],.field select,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;width:100%}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{border-color:var(--accent)}
.field textarea{font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical;min-height:140px}
.tblw{overflow-x:auto;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem;min-width:620px}
.tbl th{text-align:left;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .sc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .mu{color:var(--muted);font-size:.85rem}
.tbl .dbtn{background:none;border:0;color:var(--accent);font-weight:700;min-height:40px;padding:0 4px}
.tbl tr.det td{background:var(--bg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{border-radius:8px;padding:4px 10px;font-size:.85rem}
.tg.ok{background:var(--ok-soft);color:var(--ok)}
.tg.ko{background:var(--bad-soft);color:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:18px}
.stats div b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats div span{color:var(--muted);font-size:.85rem}
.badl{margin-top:14px;font-size:.9rem;color:var(--bad)}
.badl code{word-break:break-all;font-size:.8em}
fieldset{border:0;margin:0;padding:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode{position:relative}
.mode input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.mode span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);height:100%}
.mode b{display:block}
.mode small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35;margin-top:2px}
.mode input:checked+span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mode input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:.9rem}
.err{color:var(--bad);font-weight:700;font-size:.95rem}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 22px;min-height:56px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:not([disabled]):active{filter:brightness(.92)}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.qhead .t{font-weight:700}
.qhead .c{color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 18px;padding:0}
.chip{min-width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.chip.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.chip.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.good{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.chip[disabled]{cursor:default}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:20px}
.prompt{font-size:1.3rem;line-height:1.55}
.fig{display:flex;justify-content:center}
.fig svg{width:100%;max-width:440px;height:auto;background:var(--surface)}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--fg);stroke-width:1.6}
.tk{fill:var(--muted);font:12px var(--font)}
.axn{fill:var(--fg);font:italic 14px var(--font)}
.ln{stroke:var(--accent);stroke-width:3.2;fill:none;stroke-linecap:round}
.pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-height:68px;font-size:1.22rem;width:100%}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;color:var(--muted);background:var(--surface)}
.opt .x{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt.good{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:14px 16px;font-size:1rem;line-height:1.6}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.confirm{margin-top:18px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px;margin-top:20px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:1.1rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:1rem}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.revoir{font-size:.98rem}
.revoir b{display:block;margin-bottom:2px}
.sumtxt{overflow-wrap:anywhere;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.92rem;user-select:text;-webkit-user-select:text;margin:0}
.corr{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.corr h2{font-size:1.2rem;margin-bottom:4px}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.ci summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.ci summary::-webkit-details-marker{display:none}
.ci .no{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.ci.ok .no{background:var(--ok-soft);color:var(--ok)}
.ci.ko .no{background:var(--bad-soft);color:var(--bad)}
.ci .s{flex:1;min-width:0}
.ci .s small{display:block;color:var(--muted);font-size:.82rem}
.ci .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ci .prompt{font-size:1.08rem}
.ans{font-size:1rem;display:flex;flex-direction:column;gap:6px}
.ans div{border-radius:8px;padding:8px 12px}
.ans .you.ko{background:var(--bad-soft)}
.ans .you.ok,.ans .right{background:var(--ok-soft)}
.ans .you.none{background:var(--bg)}
.ans small{color:var(--muted);display:block}
.foot{margin-top:36px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.opt,.card,.chip,.btn{transition:background-color .12s,border-color .12s}}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:inherit}
.send{border-radius:10px;padding:14px 16px;font-size:1rem;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.send b{display:block}
.send.sending{background:var(--accent-soft)}
.send.ok{background:var(--ok-soft)}
.send.ko{background:var(--bad-soft)}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px 0;min-height:44px;font-size:inherit}
:root{--warn:#8a5a00;--warn-soft:#fdf0d3}
.sec{font-size:1.2rem;margin-top:30px}
.joinbox{margin-top:20px;gap:12px}
.joinbox h2{font-size:1.2rem}
.codefield{min-width:180px;flex:1;max-width:260px}
.codefield input{font-size:1.5rem!important;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.row{align-items:flex-end}
.fmtsw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fmt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-height:64px}
.fmt b{display:block}.fmt small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}
.fmt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.fb.warn{background:var(--warn-soft)}
.chip.verif{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.ci.vf .no{background:var(--warn-soft);color:var(--warn)}
.ans .you.vf{background:var(--warn-soft)}
.tg.vf{background:var(--warn-soft);color:var(--warn)}
.repfield input[type=text]{font-size:1.5rem;min-height:60px;font-variant-numeric:tabular-nums}
.lab{font-weight:700;font-size:.95rem}
.mf{position:relative;display:block;min-height:64px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:1.7rem;line-height:1.2;cursor:text;user-select:none;-webkit-user-select:none;overflow-x:auto}
.mf.foc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mf.dis{background:var(--bg);cursor:default}
.mf.mstat{display:inline-block;min-height:0;border:0;padding:0;background:none;font-size:1.15em;cursor:inherit;overflow:visible;vertical-align:middle}
.mfin,#mfin{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;font-size:16px;border:0;padding:0;margin:0;caret-color:transparent}
.mfv{min-height:1.4em}
.mrow{display:inline-flex;align-items:center;flex-wrap:nowrap;min-height:1.2em}
.mrow.mroot{flex-wrap:wrap}
.mc{display:inline-block;font-variant-numeric:tabular-nums}
.mc.v{font-style:italic;font-family:Georgia,'Times New Roman',serif;padding:0 .04em}
.mc.op{margin:0 .22em}
.mfr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 .18em;text-align:center}
.mfr .mrow{justify-content:center;padding:0 .2em;min-width:.9em}
.mbar{display:block;height:0;border-top:.09em solid currentColor;margin:.1em 0}
.msup{display:inline-flex;align-self:flex-start;font-size:.68em;margin-left:.06em;position:relative;top:.05em}
.msup .op{margin:0 .06em}
.mph{display:inline-flex;align-items:center;min-width:.7em;min-height:1em;border:1.5px dashed var(--muted);border-radius:4px;opacity:.7}
.mcaret{display:none;width:2px;height:1.15em;background:var(--accent);margin:0 -1px;flex:none}
.mf.foc .mcaret{display:inline-block;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mf.foc .mcaret{animation:none}}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:460px;margin-top:12px}
.kp.kx2{grid-template-columns:repeat(auto-fit,minmax(56px,1fr));margin-top:8px}
.kb{min-width:56px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:inherit;font-size:1.35rem;font-weight:700;padding:0 8px;display:flex;align-items:center;justify-content:center}
.kb.dg{background:var(--bg)}
.kb.sp{font-size:1.1rem}
.kb.sys{font-size:.85rem;grid-column:span 2}.kb.sys.on{background:var(--accent-soft);border-color:var(--accent)}
.kb:active{background:var(--accent-soft)}
.kb .mfr{margin:0}.kb .mph{min-width:.55em;min-height:.5em}.kb .mrow{min-height:.7em;padding:0 .1em;font-size:.8em}
.kx{display:inline-flex;align-items:flex-start;font-style:italic;font-family:Georgia,serif}.kx .msup{top:-.1em;font-size:.7em}
.code{letter-spacing:.2em;font-size:1.1em}
.conn{display:inline-flex;align-items:center;gap:10px;font-weight:700;align-self:flex-start}
.conn i{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.conn.on i{animation:pulse 1.6s ease-in-out infinite}
.conn.off{color:var(--bad)}.conn.off i{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.conn.on i{animation:none}}
.lobby .wait{font-size:1.5rem;font-weight:700;line-height:1.3}
.countdown{align-items:center;text-align:center;padding:48px 22px}
.bignum{font-size:7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.evbar{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.evbar .t{font-weight:700}
.timer{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px}
.timer small{color:var(--muted)}.timer b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.who{color:var(--muted)}
.donebox{align-items:center;text-align:center;padding:36px 22px}
.donebox .meta{text-align:left}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;min-height:48px;font-weight:700}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.slist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.sitem{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:64px}
.sitem small{display:block;color:var(--muted);font-size:.85rem}
.badge{display:inline-block;border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.badge.tt{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.st-w{background:var(--warn-soft);color:var(--warn)}
.badge.st-r{background:var(--ok-soft);color:var(--ok)}
.badge.st-d{background:var(--grid);color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:52px;cursor:pointer}
.chk input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.chk small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.chk.wide{align-items:flex-start}
.livehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-top:14px}
.codebox{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:18px 22px;margin-top:16px}
.codebox small{color:var(--muted);display:block}
.bigcode{font-size:4rem;font-weight:700;letter-spacing:.18em;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.linkline code{display:block;background:var(--accent-soft);border-radius:6px;padding:4px 8px;font-size:.85rem;word-break:break-all;margin:4px 0 8px}
.clock{align-self:center;font-weight:700;color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.ok{background:var(--accent)}.dot.off{background:var(--line)}
.verif{margin-top:10px}

","$x\\mapsto C\\,\\mathrm e^{x}+a$, avec $C$ réel","$x\\mapsto a\\,\\mathrm e^{Cx}$, avec $C$ réel"],e:"C'est une démonstration du programme : si $f$ est solution, $x\\mapsto f(x)\\mathrm e^{-ax}$ a une dérivée nulle, donc est constante."},{q:"Les solutions sur $\\mathbb R$ de $y'=ay+b$ ($a\\neq0$) sont les fonctions :",ok:"$x\\mapsto C\\,\\mathrm e^{ax}-\\dfrac ba$, avec $C$ réel",ko:["$x\\mapsto C\\,\\mathrm e^{ax}+\\dfrac ba$, avec $C$ réel","$x\\mapsto C\\,\\mathrm e^{ax}-\\dfrac ab$, avec $C$ réel","$x\\mapsto C\\,\\mathrm e^{bx}+a$, avec $C$ réel"],e:"La fonction constante $-\\dfrac ba$ est une solution particulière ; on lui ajoute les solutions de $y'=ay$."},{q:"Pour l'équation $y'=ay+f$, si $y_0$ est une solution particulière, toutes les solutions sont :",ok:"les fonctions $y_0+g$, où $g$ est solution de $y'=ay$",ko:["les fonctions $C\\,y_0$, avec $C$ réel","les fonctions $y_0+C$, avec $C$ réel","la seule fonction $y_0$"],e:"$y$ est solution si et seulement si $y-y_0$ est solution de l'équation homogène $y'=ay$."},{q:"L'équation $y'=ay+b$ avec la condition initiale $y(x_0)=y_0$ admet :",ok:"une unique solution",ko:["une infinité de solutions","aucune solution en général","exactement deux solutions"],e:"La condition initiale fixe la constante $C$."}]},{t:"Primitives et y' = f",items:[{q:"Une primitive de $f$ sur un intervalle $I$ est une fonction $F$ telle que :",ok:"$F$ est dérivable sur $I$ et $F'=f$",ko:["$f$ est dérivable sur $I$ et $f'=F$","$F(x)=f(x)+C$ pour un réel $C$","$F$ est solution de $y'=y$"],e:"$F$ est solution de l'équation différentielle $y'=f$."},{q:"Deux primitives d'une même fonction sur un intervalle :",ok:"diffèrent d'une constante",ko:["sont égales","ont pour différence une fonction linéaire","sont proportionnelles"],e:"Leur différence a une dérivée nulle sur un intervalle, donc elle est constante."}]}]},{id:"ts03",no:"3",t:"Limites de suites",secs:[{t:"Définitions",items:[{q:"« La suite $(u_n)$ a pour limite le réel $\\ell$ » signifie :",ok:"tout intervalle ouvert contenant $\\ell$ contient tous les termes de la suite à partir d'un certain rang",ko:["il existe un rang à partir duquel $u_n=\\ell$","un intervalle ouvert contenant $\\ell$ contient une infinité de termes de la suite","les termes de la suite se rapprochent de $\\ell$ sans jamais l'atteindre"],e:"Tous les termes, à partir d'un rang qui dépend de l'intervalle choisi."},{q:"« La suite $(u_n)$ a pour limite $+\\infty$ » signifie :",ok:"pour tout réel $A$, l'intervalle $]A;+\\infty[$ contient tous les termes à partir d'un certain rang",ko:["la suite est croissante","la suite n'est pas majorée","il existe un réel $A$ tel que $u_n>A$ pour tout $n$"],e:"« Non majorée » ne suffit pas : $u_n=n$ pour $n$ pair et $0$ sinon n'est pas majorée mais ne tend pas vers $+\\infty$."},{q:"Une suite qui admet une limite finie est dite :",ok:"convergente",ko:["divergente","bornée par définition","monotone"],e:"Une suite convergente est bornée, mais une suite bornée n'est pas forcément convergente."}]},{t:"Limites de référence",items:[{q:"Si $q>1$, alors $\\lim\\limits_{n\\to+\\infty}q^n$ vaut :",ok:"$+\\infty$",ko:["$0$","$1$","elle n'existe pas"],e:"Démonstration du programme, à l'aide de l'inégalité de Bernoulli avec $q=1+a$, $a>0$."},{q:"Si $-1<q<1$, alors $\\lim\\limits_{n\\to+\\infty}q^n$ vaut :",ok:"$0$",ko:["$+\\infty$","$1$","$q$"],e:"Par exemple $0{,}5^n\\to0$ et $(-0{,}5)^n\\to0$."},{q:"Si $q\\leqslant-1$, la suite $(q^n)$ :",ok:"n'a pas de limite",ko:["tend vers $-\\infty$","tend vers $0$","tend vers $+\\infty$"],e:"Ses termes changent de signe à chaque rang."},{q:"$\\lim\\limits_{n\\to+\\infty}\\dfrac1{\\sqrt n}$ vaut :",ok:"$0$",ko:["$+\\infty$","$1$","elle n'existe pas"],e:"$\\sqrt n\\to+\\infty$, donc son inverse tend vers $0$."}]},{t:"Opérations et formes indéterminées",items:[{q:"Laquelle de ces situations est une forme indéterminée ?",ok:"$+\\infty-\\infty$",ko:["$+\\infty+\\infty$","$\\ell\\times(+\\infty)$ avec $\\ell>0$","$\\dfrac{\\ell}{+\\infty}$ avec $\\ell$ réel"],e:"Les quatre formes indéterminées : $\\infty-\\infty$, $0\\times\\infty$, $\\dfrac\\infty\\infty$, $\\dfrac00$."},{q:"Si $\\lim u_n=0$ et $\\lim v_n=+\\infty$, alors $\\lim u_nv_n$ :",ok:"est une forme indéterminée : on ne peut pas conclure sans transformer l'expression",ko:["vaut $0$","vaut $+\\infty$","vaut $1$"],e:"« $0\\times\\infty$ » : tout dépend des suites."},{q:"Pour lever l'indétermination dans $\\lim\\limits_{n\\to+\\infty}\\dfrac{3n^2+1}{n^2-n}$, on peut :",ok:"factoriser par $n^2$ au numérateur et au dénominateur",ko:["calculer la limite du numérateur puis celle du dénominateur","multiplier par la quantité conjuguée","utiliser l'inégalité de Bernoulli"],e:"Après factorisation : $\\dfrac{3+1/n^2}{1-1/n}\\to3$."}]},{t:"Théorèmes de comparaison et convergence monotone",items:[{q:"Si $u_n\\leqslant v_n$ à partir d'un certain rang et $\\lim u_n=+\\infty$, alors :",ok:"$\\lim v_n=+\\infty$",ko:["$\\lim v_n=-\\infty$","$(v_n)$ converge","on ne peut rien dire de $(v_n)$"],e:"Démonstration du programme : une suite minorée par une suite qui diverge vers $+\\infty$ diverge vers $+\\infty$."},{q:"Théorème des gendarmes : si $u_n\\leqslant v_n\\leqslant w_n$ à partir d'un certain rang, et si :",ok:"$(u_n)$ et $(w_n)$ convergent vers le même réel $\\ell$, alors $(v_n)$ converge vers $\\ell$",ko:["$(u_n)$ et $(w_n)$ convergent, alors $(v_n)$ converge","$(u_n)$ converge vers $\\ell$, alors $(v_n)$ converge vers $\\ell$","$(v_n)$ converge vers $\\ell$, alors $(u_n)$ et $(w_n)$ convergent vers $\\ell$"],e:"Il faut un encadrement par deux suites de même limite."},{q:"Théorème de convergence monotone : une suite croissante et majorée :",ok:"converge",ko:["tend vers $+\\infty$","converge vers son majorant","est constante à partir d'un certain rang"],e:"Elle converge vers une limite $\\ell$ inférieure ou égale à tout majorant, pas forcément vers le majorant trouvé."},{q:"Une suite croissante non majorée :",ok:"tend vers $+\\infty$",ko:["converge","n'a pas de limite","tend vers $0$"],e:"Démonstration du programme : pour tout $A$, un terme $u_{N}$ dépasse $A$, et tous les suivants aussi car la suite est croissante."},{q:"$(u_n)$ est définie par $u_{n+1}=f(u_n)$ avec $f$ continue, et converge vers $\\ell$. Alors :",ok:"$\\ell$ vérifie $f(\\ell)=\\ell$",ko:["$\\ell=f(0)$","$\\ell=u_0$","$f(\\ell)=0$"],e:"On passe à la limite dans $u_{n+1}=f(u_n)$ grâce à la continuité de $f$."}]}]},{id:"ts04",no:"P1",t:"Loi binomiale",secs:[{t:"Épreuve et schéma de Bernoulli",items:[{q:"Une épreuve de Bernoulli est :",ok:"une expérience aléatoire à deux issues, appelées succès et échec",ko:["une expérience répétée plusieurs fois de façon indépendante","une expérience dont toutes les issues sont équiprobables","une expérience où la probabilité du succès vaut $0{,}5$"],e:"Si $p$ est la probabilité du succès, celle de l'échec est $1-p$."},{q:"Un schéma de Bernoulli de paramètres $n$ et $p$ est :",ok:"la répétition de $n$ épreuves de Bernoulli identiques et indépendantes, de paramètre $p$",ko:["une épreuve de Bernoulli de paramètre $\\dfrac pn$","la répétition de $n$ épreuves dont la probabilité de succès change à chaque fois","un tirage sans remise de $n$ éléments"],e:"Un tirage sans remise n'est en général pas un schéma de Bernoulli : les épreuves ne sont pas indépendantes."},{q:"Si $X$ compte les succès dans un schéma de Bernoulli de paramètres $n$ et $p$, alors $X$ suit :",ok:"la loi binomiale $\\mathcal B(n;p)$",ko:["la loi de Bernoulli de paramètre $p$","la loi uniforme sur $\\{0;1;\\dots;n\\}$","la loi binomiale $\\mathcal B(p;n)$"],e:"$X$ prend les valeurs $0, 1, \\dots, n$."}]},{t:"Loi binomiale",items:[{q:"Si $X$ suit $\\mathcal B(n;p)$, pour tout entier $k$ entre $0$ et $n$, $P(X=k)$ vaut :",ok:"$\\dbinom nk p^k(1-p)^{n-k}$",ko:["$p^k(1-p)^{n-k}$","$\\dbinom nk p^{n-k}(1-p)^{k}$","$\\dbinom nk p^k$"],e:"Démonstration du programme : chaque chemin à $k$ succès a probabilité $p^k(1-p)^{n-k}$ et il y en a $\\binom nk$."},{q:"Dans un arbre de schéma de Bernoulli à $n$ épreuves, le nombre de chemins réalisant exactement $k$ succès est :",ok:"$\\dbinom nk$",ko:["$n^k$","$k!$","$2^n$"],e:"C'est le nombre de façons de placer les $k$ succès parmi les $n$ épreuves."},{q:"Si $X$ suit $\\mathcal B(n;p)$, son espérance vaut :",ok:"$np$",ko:["$np(1-p)$","$\\dfrac np$","$\\sqrt{np(1-p)}$"],e:"Et sa variance vaut $np(1-p)$."},{q:"Si $X$ suit $\\mathcal B(n;p)$, sa variance vaut :",ok:"$np(1-p)$",ko:["$np$","$\\sqrt{np(1-p)}$","$p(1-p)$"],e:"L'écart type est $\\sqrt{np(1-p)}$."},{q:"Si $X$ suit $\\mathcal B(n;p)$, $P(X\\geqslant1)$ vaut :",ok:"$1-(1-p)^n$",ko:["$1-p^n$","$np$","$(1-p)^n$"],e:"L'événement contraire de « au moins un succès » est « aucun succès », de probabilité $(1-p)^n$."},{q:"Si $X$ suit $\\mathcal B(n;p)$, alors $P(X\\leqslant k)$ :",ok:"se calcule avec la fonction de répartition de la calculatrice (somme des $P(X=i)$ pour $i$ de $0$ à $k$)",ko:["vaut $\\dbinom nk p^k(1-p)^{n-k}$","vaut $1-P(X\\geqslant k)$","vaut $k\\,p$"],e:"Attention : $P(X\\leqslant k)=1-P(X\\geqslant k+1)$, et non $1-P(X\\geqslant k)$."}]}]},{id:"ts05",no:"4",t:"Limites de fonctions",secs:[{t:"Définitions et asymptotes",items:[{q:"Si $\\lim\\limits_{x\\to+\\infty}f(x)=\\ell$ ($\\ell$ réel), alors la courbe de $f$ admet :",ok:"une asymptote horizontale d'équation $y=\\ell$ en $+\\infty$",ko:["une asymptote verticale d'équation $x=\\ell$","une asymptote horizontale d'équation $x=\\ell$","une tangente horizontale au point d'abscisse $\\ell$"],e:"La courbe se rapproche de la droite $y=\\ell$."},{q:"Si $\\lim\\limits_{x\\to a}f(x)=+\\infty$, alors la courbe de $f$ admet :",ok:"une asymptote verticale d'équation $x=a$",ko:["une asymptote horizontale d'équation $y=a$","une asymptote verticale d'équation $y=a$","une asymptote oblique"],e:"Limite infinie en un réel $a$ : asymptote verticale."},{q:"$\\lim\\limits_{x\\to0^+}\\dfrac1x$ vaut :",ok:"$+\\infty$",ko:["$-\\infty$","$0$","$1$"],e:"Et $\\lim\\limits_{x\\to0^-}\\dfrac1x=-\\infty$ : il faut distinguer la gauche et la droite."}]},{t:"Limites de référence et croissances comparées",items:[{q:"$\\lim\\limits_{x\\to+\\infty}\\mathrm e^{x}$ et $\\lim\\limits_{x\\to-\\infty}\\mathrm e^{x}$ valent :",ok:"$+\\infty$ et $0$",ko:["$+\\infty$ et $-\\infty$","$0$ et $+\\infty$","$+\\infty$ et $1$"],e:"Démonstration du programme ; la droite d'équation $y=0$ est asymptote en $-\\infty$."},{q:"Croissance comparée : pour tout entier $n\\geqslant1$, $\\lim\\limits_{x\\to+\\infty}\\dfrac{\\mathrm e^{x}}{x^n}$ vaut :",ok:"$+\\infty$",ko:["$0$","$1$","c'est une forme indéterminée sans limite"],e:"« L'exponentielle l'emporte » sur toute puissance de $x$ (démonstration du programme)."},{q:"Pour tout entier $n\\geqslant1$, $\\lim\\limits_{x\\to-\\infty}x^n\\mathrm e^{x}$ vaut :",ok:"$0$",ko:["$+\\infty$","$-\\infty$","$1$"],e:"Croissance comparée en $-\\infty$."},{q:"$\\lim\\limits_{x\\to0}\\dfrac{\\mathrm e^{x}-1}{x}$ vaut :",ok:"$1$",ko:["$0$","$+\\infty$","$\\mathrm e$"],e:"C'est le nombre dérivé de l'exponentielle en $0$ : $\\exp'(0)=\\mathrm e^0=1$."}]},{t:"Opérations, composée, comparaison",items:[{q:"Si $\\lim\\limits_{x\\to a}u(x)=b$ et $\\lim\\limits_{X\\to b}f(X)=c$, alors $\\lim\\limits_{x\\to a}f(u(x))$ vaut :",ok:"$c$",ko:["$b$","$f(a)$","$u(c)$"],e:"Théorème de composition des limites ($a$, $b$, $c$ réels ou infinis)."},{q:"Si $f(x)\\geqslant g(x)$ pour $x$ assez grand et $\\lim\\limits_{x\\to+\\infty}g(x)=+\\infty$, alors :",ok:"$\\lim\\limits_{x\\to+\\infty}f(x)=+\\infty$",ko:["$\\lim\\limits_{x\\to+\\infty}f(x)=-\\infty$","$f$ admet une limite finie en $+\\infty$","on ne peut rien conclure"],e:"Théorème de comparaison."},{q:"Si $g(x)\\leqslant f(x)\\leqslant h(x)$ au voisinage de $+\\infty$ et $\\lim g=\\lim h=\\ell$ en $+\\infty$, alors :",ok:"$\\lim\\limits_{x\\to+\\infty}f(x)=\\ell$",ko:["$f$ est constante égale à $\\ell$","$f(x)=\\ell$ pour $x$ assez grand","on ne peut rien conclure"],e:"Théorème des gendarmes pour les fonctions."},{q:"Pour lever l'indétermination dans $\\lim\\limits_{x\\to+\\infty}\\left(\\mathrm e^{x}-x\\right)$, on peut écrire :",ok:"$\\mathrm e^{x}-x=x\\left(\\dfrac{\\mathrm e^{x}}{x}-1\\right)$, qui tend vers $+\\infty$",ko:["$\\mathrm e^{x}-x=\\mathrm e^{x}(1-x)$, qui tend vers $-\\infty$","$\\lim\\mathrm e^{x}-\\lim x=+\\infty-\\infty=0$","$\\mathrm e^{x}-x=\\mathrm e^{x-x}=1$"],e:"On factorise par le terme dominant ou par $x$, puis on utilise la croissance comparée."}]}]},{id:"ts06",no:"G1",t:"Vecteurs, droites et plans de l'espace",secs:[{t:"Vecteurs, colinéarité",items:[{q:"Deux vecteurs non nuls $\\vec u$ et $\\vec v$ de l'espace sont colinéaires lorsque :",ok:"il existe un réel $k$ tel que $\\vec v=k\\,\\vec u$",ko:["ils ont la même norme","ils ont le même sens","il existe un réel $k$ tel que $\\vec v=\\vec u+k$"],e:"Colinéaires : même direction (sens et norme quelconques)."},{q:"Trois points distincts $A$, $B$, $C$ sont alignés si et seulement si :",ok:"$\\overrightarrow{AB}$ et $\\overrightarrow{AC}$ sont colinéaires",ko:["$\\overrightarrow{AB}=\\overrightarrow{AC}$","$AB=AC$","$\\overrightarrow{AB}$ et $\\overrightarrow{AC}$ sont coplanaires"],e:"Deux vecteurs sont toujours coplanaires : ce n'est pas un critère d'alignement."},{q:"$ABCD$ est un parallélogramme si et seulement si :",ok:"$\\overrightarrow{AB}=\\overrightarrow{DC}$",ko:["$\\overrightarrow{AB}=\\overrightarrow{CD}$","$\\overrightarrow{AB}=\\overrightarrow{AD}$","$AB=CD$"],e:"Attention à l'ordre des lettres : $\\overrightarrow{AB}=\\overrightarrow{DC}$."}]},{t:"Coplanarité",items:[{q:"Trois vecteurs $\\vec u$, $\\vec v$, $\\vec w$ ($\\vec u$ et $\\vec v$ non colinéaires) sont coplanaires si et seulement si :",ok:"il existe des réels $a$ et $b$ tels que $\\vec w=a\\,\\vec u+b\\,\\vec v$",ko:["ils sont deux à deux colinéaires","$\\vec u+\\vec v+\\vec w=\\vec 0$ uniquement","ils ont la même norme"],e:"$\\vec w$ s'écrit comme combinaison linéaire de $\\vec u$ et $\\vec v$."},{q:"Quatre points $A$, $B$, $C$, $D$ sont coplanaires lorsque :",ok:"les vecteurs $\\overrightarrow{AB}$, $\\overrightarrow{AC}$ et $\\overrightarrow{AD}$ sont coplanaires",ko:["les vecteurs $\\overrightarrow{AB}$ et $\\overrightarrow{CD}$ sont colinéaires","ils sont alignés deux à deux","$AB=CD$"],e:"Si $\\overrightarrow{AB}$ et $\\overrightarrow{CD}$ sont colinéaires, les points sont coplanaires, mais la réciproque est fausse."},{q:"Trois points de l'espace :",ok:"sont toujours coplanaires",ko:["ne sont jamais coplanaires","sont coplanaires seulement s'ils sont alignés","sont coplanaires seulement s'ils forment un triangle rectangle"],e:"Par trois points non alignés passe un unique plan ; trois points alignés sont dans une infinité de plans."}]},{t:"Droites et plans",items:[{q:"La droite passant par $A$ et de vecteur directeur $\\vec u$ est l'ensemble des points $M$ tels que :",ok:"$\\overrightarrow{AM}=t\\,\\vec u$, avec $t$ réel",ko:["$\\overrightarrow{AM}=\\vec u$","$AM=\\|\\vec u\\|$","$\\overrightarrow{AM}\\cdot\\vec u=0$"],e:"$\\overrightarrow{AM}$ et $\\vec u$ sont colinéaires."},{q:"Le plan passant par $A$ et dirigé par deux vecteurs non colinéaires $\\vec u$ et $\\vec v$ est l'ensemble des points $M$ tels que :",ok:"$\\overrightarrow{AM}=s\\,\\vec u+t\\,\\vec v$, avec $s$ et $t$ réels",ko:["$\\overrightarrow{AM}=t\\,\\vec u$, avec $t$ réel","$\\overrightarrow{AM}=\\vec u+\\vec v$","$\\overrightarrow{AM}=s\\,\\vec u\\times t\\,\\vec v$"],e:"On parle de couple de vecteurs directeurs du plan."},{q:"Deux droites de l'espace qui n'ont aucun point commun :",ok:"sont parallèles ou non coplanaires",ko:["sont forcément parallèles","sont forcément sécantes","sont forcément orthogonales"],e:"Dans l'espace, deux droites peuvent n'être contenues dans aucun plan commun."},{q:"Deux plans de l'espace non parallèles :",ok:"sont sécants selon une droite",ko:["sont sécants en un point","n'ont aucun point commun","sont confondus"],e:"Deux plans sont soit parallèles (strictement ou confondus), soit sécants selon une droite."},{q:"Une droite est parallèle à un plan lorsque :",ok:"un vecteur directeur de la droite est un vecteur du plan (combinaison des vecteurs directeurs du plan)",ko:["elle coupe le plan en un point","elle est orthogonale à une droite du plan","elle est parallèle à tout le plan seulement si elle est contenue dans le plan"],e:"Elle est alors contenue dans le plan ou strictement parallèle à lui."},{q:"Théorème du toit : si deux plans sécants contiennent respectivement deux droites parallèles, alors :",ok:"leur droite d'intersection est parallèle à ces deux droites",ko:["leur droite d'intersection est orthogonale à ces deux droites","les deux droites sont confondues","les deux plans sont parallèles"],e:"Utile pour construire des sections de solides."}]}]},{id:"ts07",no:"G2",t:"Géométrie repérée",secs:[{t:"Bases et repères",items:[{q:"Trois vecteurs $\\vec\\imath$, $\\vec\\jmath$, $\\vec k$ forment une base de l'espace lorsque :",ok:"ils ne sont pas coplanaires",ko:["ils sont deux à deux colinéaires","ils sont coplanaires","ils ont la même norme"],e:"Tout vecteur s'écrit alors de façon unique $x\\vec\\imath+y\\vec\\jmath+z\\vec k$."},{q:"Dans un repère, si $A(x_A;y_A;z_A)$ et $B(x_B;y_B;z_B)$, alors $\\overrightarrow{AB}$ a pour coordonnées :",ok:"$(x_B-x_A\\,;\\,y_B-y_A\\,;\\,z_B-z_A)$",ko:["$(x_A-x_B\\,;\\,y_A-y_B\\,;\\,z_A-z_B)$","$(x_A+x_B\\,;\\,y_A+y_B\\,;\\,z_A+z_B)$","$\\left(\\dfrac{x_A+x_B}2\\,;\\,\\dfrac{y_A+y_B}2\\,;\\,\\dfrac{z_A+z_B}2\\right)$"],e:"« Arrivée moins départ ». La dernière proposition donne le milieu de $[AB]$."},{q:"Le milieu $I$ de $[AB]$ a pour coordonnées :",ok:"$\\left(\\dfrac{x_A+x_B}2\\,;\\,\\dfrac{y_A+y_B}2\\,;\\,\\dfrac{z_A+z_B}2\\right)$",ko:["$(x_B-x_A\\,;\\,y_B-y_A\\,;\\,z_B-z_A)$","$\\left(\\dfrac{x_B-x_A}2\\,;\\,\\dfrac{y_B-y_A}2\\,;\\,\\dfrac{z_B-z_A}2\\right)$","$(x_A+x_B\\,;\\,y_A+y_B\\,;\\,z_A+z_B)$"],e:"Moyenne des coordonnées."},{q:"Dans un repère orthonormé, la distance $AB$ vaut :",ok:"$\\sqrt{(x_B-x_A)^2+(y_B-y_A)^2+(z_B-z_A)^2}$",ko:["$(x_B-x_A)^2+(y_B-y_A)^2+(z_B-z_A)^2$","$|x_B-x_A|+|y_B-y_A|+|z_B-z_A|$","$\\sqrt{(x_B+x_A)^2+(y_B+y_A)^2+(z_B+z_A)^2}$"],e:"Cette formule n'est valable que dans un repère orthonormé."},{q:"$\\vec u(x;y;z)$ et $\\vec v(x';y';z')$ sont colinéaires si et seulement si :",ok:"il existe un réel $k$ tel que $x'=kx$, $y'=ky$ et $z'=kz$ (pour $\\vec u\\neq\\vec 0$)",ko:["$xx'+yy'+zz'=0$","$x+y+z=x'+y'+z'$","$xy'-x'y=0$ suffit"],e:"Dans l'espace, le seul test $xy'-x'y=0$ ne suffit pas : il faut la proportionnalité des trois coordonnées."}]},{t:"Représentation paramétrique d'une droite",items:[{q:"Une représentation paramétrique de la droite passant par $A(x_A;y_A;z_A)$ et dirigée par $\\vec u(a;b;c)$ est :",ok:"$\\begin{cases}x=x_A+at\\\\y=y_A+bt\\\\z=z_A+ct\\end{cases}$, $t\\in\\mathbb R$",ko:["$\\begin{cases}x=a+x_At\\\\y=b+y_At\\\\z=c+z_At\\end{cases}$, $t\\in\\mathbb R$","$ax+by+cz+d=0$","$\\begin{cases}x=x_A+at\\\\y=y_A+at\\\\z=z_A+at\\end{cases}$, $t\\in\\mathbb R$"],e:"Les constantes sont les coordonnées d'un point, les coefficients de $t$ celles d'un vecteur directeur."},{q:"Une droite de l'espace admet :",ok:"une infinité de représentations paramétriques",ko:["une seule représentation paramétrique","exactement deux représentations paramétriques","une équation cartésienne unique"],e:"On peut changer de point et de vecteur directeur (colinéaire)."},{q:"Pour savoir si le point $M$ appartient à la droite de représentation paramétrique donnée, on :",ok:"cherche un réel $t$ qui vérifie les trois équations à la fois",ko:["remplace $t$ par $0$","vérifie une seule des trois équations","calcule la distance de $M$ à l'origine"],e:"Le même $t$ doit convenir pour les trois coordonnées."}]},{t:"Positions relatives de deux droites",items:[{q:"Deux droites de vecteurs directeurs non colinéaires et sans point commun sont :",ok:"non coplanaires",ko:["parallèles","sécantes","confondues"],e:"Non parallèles et sans point commun : elles ne sont pas dans un même plan."},{q:"Pour déterminer l'intersection de deux droites données par des représentations paramétriques, on :",ok:"utilise deux paramètres différents ($t$ et $s$) et on résout le système obtenu",ko:["utilise le même paramètre $t$ pour les deux droites","compare les vecteurs directeurs uniquement","calcule la distance entre les deux droites"],e:"Utiliser le même paramètre est une erreur classique : les deux droites ne passent pas au point commun « au même instant »."},{q:"Deux droites de vecteurs directeurs colinéaires sont :",ok:"parallèles (strictement ou confondues)",ko:["sécantes","non coplanaires","orthogonales"],e:"Pour savoir si elles sont confondues, on teste si un point de l'une appartient à l'autre."}]}]},{id:"ts08",no:"5",t:"Continuité",secs:[{t:"Définition",items:[{q:"Une fonction $f$ est continue en un réel $a$ de son ensemble de définition lorsque :",ok:"$\\lim\\limits_{x\\to a}f(x)=f(a)$",ko:["$f(a)$ existe","$f$ est dérivable en $a$","$\\lim\\limits_{x\\to a}f(x)$ existe"],e:"Graphiquement, la courbe ne présente pas de « saut » en $a$."},{q:"Quelle affirmation est vraie ?",ok:"toute fonction dérivable sur un intervalle est continue sur cet intervalle",ko:["toute fonction continue sur un intervalle est dérivable sur cet intervalle","la fonction valeur absolue n'est pas continue en $0$","la fonction racine carrée n'est pas continue en $0$"],e:"La réciproque est fausse : $x\\mapsto|x|$ est continue en $0$ mais pas dérivable en $0$."},{q:"La fonction partie entière $x\\mapsto\\lfloor x\\rfloor$ est :",ok:"discontinue en chaque entier",ko:["continue sur $\\mathbb R$","dérivable sur $\\mathbb R$","discontinue en chaque réel non entier"],e:"Sa courbe fait un saut de $1$ en chaque entier."},{q:"Si $(u_n)$ converge vers $\\ell$ et si $f$ est continue en $\\ell$, alors :",ok:"$(f(u_n))$ converge vers $f(\\ell)$",ko:["$(f(u_n))$ converge vers $\\ell$","$(u_n)$ est constante","$(f(u_n))$ diverge"],e:"C'est ce qui justifie le passage à la limite dans $u_{n+1}=f(u_n)$."}]},{t:"Théorème des valeurs intermédiaires",items:[{q:"Théorème des valeurs intermédiaires : si $f$ est continue sur $[a;b]$, alors :",ok:"pour tout réel $k$ compris entre $f(a)$ et $f(b)$, l'équation $f(x)=k$ admet au moins une solution dans $[a;b]$",ko:["pour tout réel $k$, l'équation $f(x)=k$ admet une solution dans $[a;b]$","l'équation $f(x)=0$ admet une unique solution dans $[a;b]$","$f$ est monotone sur $[a;b]$"],e:"« Au moins une » : l'unicité demande en plus la stricte monotonie."},{q:"Corollaire du TVI : si $f$ est continue et strictement monotone sur $[a;b]$, alors pour tout $k$ compris entre $f(a)$ et $f(b)$ :",ok:"l'équation $f(x)=k$ admet une unique solution dans $[a;b]$",ko:["l'équation $f(x)=k$ admet au moins deux solutions dans $[a;b]$","l'équation $f(x)=k$ n'a pas de solution dans $[a;b]$","$k=f\\!\\left(\\dfrac{a+b}2\\right)$"],e:"Existence par le TVI, unicité par la stricte monotonie."},{q:"L'algorithme de dichotomie sert à :",ok:"obtenir un encadrement de plus en plus fin d'une solution de $f(x)=0$",ko:["calculer une dérivée","démontrer qu'une fonction est continue","trouver toutes les solutions exactes d'une équation"],e:"À chaque étape, on coupe l'intervalle en deux et on garde la moitié où $f$ change de signe."},{q:"Si $f$ est continue sur $[a;b]$ et $f(a)\\times f(b)<0$, alors :",ok:"l'équation $f(x)=0$ admet au moins une solution dans $]a;b[$",ko:["l'équation $f(x)=0$ n'a pas de solution dans $[a;b]$","$f$ est strictement croissante sur $[a;b]$","l'équation $f(x)=0$ admet exactement une solution dans $[a;b]$"],e:"$f(a)$ et $f(b)$ sont de signes contraires, donc $0$ est compris entre eux."}]}]},{id:"ts09",no:"6",t:"Dérivabilité",secs:[{t:"Nombre dérivé, tangente",items:[{q:"$f$ est dérivable en $a$ lorsque :",ok:"$\\dfrac{f(a+h)-f(a)}{h}$ admet une limite finie quand $h$ tend vers $0$",ko:["$f(a)$ existe","$f$ est continue en $a$","$\\dfrac{f(a+h)-f(a)}{h}$ tend vers $0$ quand $h$ tend vers $0$"],e:"Cette limite est le nombre dérivé $f'(a)$."},{q:"Une équation de la tangente à la courbe de $f$ au point d'abscisse $a$ est :",ok:"$y=f'(a)(x-a)+f(a)$",ko:["$y=f(a)(x-a)+f'(a)$","$y=f'(a)x+f(a)$","$y=f'(x)(x-a)+f(a)$"],e:"Le coefficient directeur est $f'(a)$, et la droite passe par le point $(a;f(a))$."},{q:"La fonction $x\\mapsto\\sqrt x$ est :",ok:"définie et continue en $0$, mais non dérivable en $0$",ko:["dérivable en $0$, de nombre dérivé $0$","non définie en $0$","discontinue en $0$"],e:"$\\dfrac{\\sqrt h-0}{h}=\\dfrac1{\\sqrt h}\\to+\\infty$ : tangente verticale en $0$."}]},{t:"Dérivée d'une composée",items:[{q:"Si $u$ est dérivable sur $I$ et $g$ dérivable sur un intervalle contenant $u(I)$, alors la dérivée de $x\\mapsto g(u(x))$ est :",ok:"$x\\mapsto u'(x)\\times g'(u(x))$",ko:["$x\\mapsto g'(u'(x))$","$x\\mapsto g'(x)\\times u'(x)$","$x\\mapsto g'(u(x))$"],e:"$\\left(g\\circ u\\right)'=u'\\times\\left(g'\\circ u\\right)$."},{q:"La dérivée de $x\\mapsto\\left(u(x)\\right)^n$ ($n$ entier, $n\\geqslant1$) est :",ok:"$x\\mapsto n\\,u'(x)\\left(u(x)\\right)^{n-1}$",ko:["$x\\mapsto n\\left(u(x)\\right)^{n-1}$","$x\\mapsto \\left(u'(x)\\right)^n$","$x\\mapsto n\\,u'(x)\\left(u(x)\\right)^{n}$"],e:"Cas particulier de la dérivée d'une composée."},{q:"La dérivée de $x\\mapsto\\sqrt{u(x)}$ (avec $u>0$) est :",ok:"$x\\mapsto\\dfrac{u'(x)}{2\\sqrt{u(x)}}$",ko:["$x\\mapsto\\dfrac{1}{2\\sqrt{u(x)}}$","$x\\mapsto\\sqrt{u'(x)}$","$x\\mapsto\\dfrac{u'(x)}{\\sqrt{u(x)}}$"],e:"$\\left(\\sqrt u\\right)'=\\dfrac{u'}{2\\sqrt u}$."},{q:"La dérivée de $x\\mapsto\\mathrm e^{-x^2}$ est :",ok:"$x\\mapsto -2x\\,\\mathrm e^{-x^2}$",ko:["$x\\mapsto \\mathrm e^{-x^2}$","$x\\mapsto -2x\\,\\mathrm e^{-2x}$","$x\\mapsto -x^2\\,\\mathrm e^{-x^2-1}$"],e:"$u(x)=-x^2$, $u'(x)=-2x$, et $\\left(\\mathrm e^{u}\\right)'=u'\\mathrm e^{u}$."},{q:"La dérivée de $x\\mapsto f(ax+b)$ est :",ok:"$x\\mapsto a\\,f'(ax+b)$",ko:["$x\\mapsto f'(ax+b)$","$x\\mapsto a\\,f'(x)+b$","$x\\mapsto (ax+b)\\,f'(x)$"],e:"Composée avec une fonction affine."}]},{t:"Dérivée seconde",items:[{q:"La dérivée seconde $f''$ d'une fonction $f$ est :",ok:"la dérivée de la fonction dérivée $f'$",ko:["le carré de $f'$","le produit $f\\times f'$","la dérivée de $f$ multipliée par $2$"],e:"On dérive deux fois."},{q:"Si $f(x)=x^3-3x$, alors $f''(x)$ vaut :",ok:"$6x$",ko:["$3x^2-3$","$6$","$3x^2$"],e:"$f'(x)=3x^2-3$, puis $f''(x)=6x$."}]}]},{id:"ts10",no:"7",t:"Convexité",secs:[{t:"Définitions",items:[{q:"Une fonction $f$ dérivable sur $I$ est convexe sur $I$ lorsque :",ok:"sa courbe est au-dessus de chacune de ses tangentes",ko:["sa courbe est au-dessous de chacune de ses tangentes","$f$ est croissante sur $I$","$f$ est positive sur $I$"],e:"Définition équivalente : la courbe est en dessous de ses cordes."},{q:"Une fonction convexe sur $I$ a sa courbe :",ok:"au-dessous de chacune de ses cordes sur l'intervalle correspondant",ko:["au-dessus de chacune de ses cordes","confondue avec ses cordes","au-dessous de ses tangentes"],e:"Entre deux points, la courbe reste sous le segment qui les relie."},{q:"Une fonction $f$ deux fois dérivable sur $I$ est convexe sur $I$ si et seulement si :",ok:"$f''\\geqslant0$ sur $I$",ko:["$f'\\geqslant0$ sur $I$","$f\\geqslant0$ sur $I$","$f''\\leqslant0$ sur $I$"],e:"De façon équivalente : $f'$ est croissante sur $I$."},{q:"Une fonction dérivable est concave sur $I$ si et seulement si :",ok:"$f'$ est décroissante sur $I$",ko:["$f'$ est croissante sur $I$","$f$ est décroissante sur $I$","$f'$ est négative sur $I$"],e:"Concave : courbe au-dessous de ses tangentes ; $f''\\leqslant0$ si $f$ est deux fois dérivable."}]},{t:"Point d'inflexion",items:[{q:"Un point d'inflexion de la courbe de $f$ est un point où :",ok:"la courbe traverse sa tangente (la convexité change)",ko:["la tangente est horizontale","$f$ change de sens de variation","$f$ s'annule"],e:"Si $f$ est deux fois dérivable, $f''$ s'annule en changeant de signe."},{q:"Si $f''$ s'annule en $a$ en changeant de signe, alors :",ok:"la courbe de $f$ admet un point d'inflexion d'abscisse $a$",ko:["$f$ admet un extremum en $a$","$f'(a)=0$","$f(a)=0$"],e:"Attention : $f''(a)=0$ sans changement de signe ne suffit pas (exemple : $x\\mapsto x^4$ en $0$)."},{q:"La fonction $x\\mapsto x^3$ admet en $0$ :",ok:"un point d'inflexion",ko:["un minimum local","un maximum local","une tangente verticale"],e:"$f''(x)=6x$ change de signe en $0$ ; la courbe traverse sa tangente $y=0$."}]},{t:"Applications",items:[{q:"La fonction exponentielle est :",ok:"convexe sur $\\mathbb R$",ko:["concave sur $\\mathbb R$","convexe sur $[0;+\\infty[$ et concave sur $]-\\infty;0]$","ni convexe ni concave"],e:"$\\exp''=\\exp>0$."},{q:"La fonction exponentielle étant convexe, sa courbe est au-dessus de sa tangente en $0$. On en déduit que pour tout réel $x$ :",ok:"$\\mathrm e^{x}\\geqslant 1+x$",ko:["$\\mathrm e^{x}\\leqslant 1+x$","$\\mathrm e^{x}\\geqslant x$ seulement pour $x\\geqslant0$","$\\mathrm e^{x}\\geqslant \\mathrm e\\,x+1$"],e:"La tangente en $0$ a pour équation $y=x+1$."},{q:"Si $f''\\geqslant0$ sur $I$, alors la courbe de $f$ est au-dessus de ses tangentes. Pour le démontrer, on étudie :",ok:"le signe de $g(x)=f(x)-\\left(f'(a)(x-a)+f(a)\\right)$ à l'aide de $g'$ et de $g''=f''$",ko:["le signe de $f(x)$","le signe de $f'(a)$","la limite de $f$ en $+\\infty$"],e:"Démonstration du programme : $g'=f'-f'(a)$ est croissante et s'annule en $a$, donc $g$ admet un minimum $0$ en $a$."},{q:"La fonction $x\\mapsto\\ln x$ est :",ok:"concave sur $]0;+\\infty[$",ko:["convexe sur $]0;+\\infty[$","convexe sur $]0;1]$ et concave sur $[1;+\\infty[$","affine"],e:"$\\ln''(x)=-\\dfrac1{x^2}<0$."}]}]},{id:"ts11",no:"D1",t:"Dénombrement",secs:[{t:"Ensembles et listes",items:[{q:"Le cardinal du produit cartésien $A\\times B$ (avec $A$ et $B$ finis) vaut :",ok:"$\\mathrm{card}(A)\\times\\mathrm{card}(B)$",ko:["$\\mathrm{card}(A)+\\mathrm{card}(B)$","$\\mathrm{card}(A)^{\\mathrm{card}(B)}$","$\\mathrm{card}(A\\cup B)$"],e:"Principe multipli rrés, ensuite les multiplications, enfin les additions et soustractions."],x:[[`f(x) = 3x ${MINUS} 5. Calculer f(4).`,[`f(4) = 3 × 4 ${MINUS} 5 = 12 ${MINUS} 5 = 7.`]],[`g(x) = x${SQ} ${MINUS} 2x + 1. Calculer g(${MINUS}3).`,[`g(${MINUS}3) = (${MINUS}3)${SQ} ${MINUS} 2 × (${MINUS}3) + 1`,"= 9 + 6 + 1 = 16."]],[`h(x) = ${MINUS}x${SQ} + 4. Calculer h(2).`,[`h(2) = ${MINUS}2${SQ} + 4 = ${MINUS}4 + 4 = 0.`,`Le signe ${MINUS} n’est pas élevé au carré.`]],[`f(x) = 2x + 1. Compléter le tableau de valeurs pour x = ${MINUS}1, 0 et 3.`,[`f(${MINUS}1) = 2 × (${MINUS}1) + 1 = ${MINUS}1 ; f(0) = 1 ; f(3) = 2 × 3 + 1 = 7.`,tvTab("f(x)",[MINUS+"1",0,3],[MINUS+"1",1,7])]]],p:`(${MINUS}3)${SQ} = 9, alors que ${MINUS}3${SQ} = ${MINUS}9.`},a06:{m:["S’il y a des parenthèses, on commence par développer.","On regroupe les termes en x d’un côté et les nombres de l’autre. Un terme qui change de côté change de signe.","On divise par le nombre qui multiplie x.","On vérifie en remplaçant x par la valeur trouvée."],x:[["Résoudre 3x + 5 = 20.",[`3x = 20 ${MINUS} 5 = 15.`,`x = ${FX(15,3)} = 5.`]],[`Résoudre 5x ${MINUS} 3 = 2x + 9.`,[`5x ${MINUS} 2x = 9 + 3.`,"3x = 12, donc x = 4.",`Vérification : 5 × 4 ${MINUS} 3 = 17 et 2 × 4 + 9 = 17.`]],[`Résoudre 2(x ${MINUS} 3) = x + 1.`,[`On développe : 2x ${MINUS} 6 = x + 1.`,`2x ${MINUS} x = 1 + 6, donc x = 7.`]],["Résoudre 4x + 3 = 0.",[`4x = ${MINUS}3.`,`x = ${MINUS}${FX(3,4)}.`]]],p:"Dans 3x = 15, le 3 multiplie x : on divise par 3, on ne soustrait pas 3."},a07:{m:["On recopie la formule.","On remplace chaque lettre par sa valeur.","On calcule en respectant les priorités : puissances, puis multiplications et divisions, puis additions et soustractions.","On donne le résultat avec son unité."],x:[[`v = ${FX("d","t")}. Calculer v pour d = 150${NB}km et t = 2${NB}h.`,[`v = ${FX(150,2)} = 75${NB}km/h.`]],[`E = ${FX(1,2)} × m × v${SQ}. Calculer E pour m = 4${NB}kg et v = 3${NB}m/s.`,[`E = ${FX(1,2)} × 4 × 3${SQ} = ${FX(1,2)} × 4 × 9`,`= 2 × 9 = 18${NB}J.`]],["F = 1,8 × C + 32. Calculer F pour C = 20.",["F = 1,8 × 20 + 32 = 36 + 32 = 68.","La multiplication se fait avant l’addition."]],[`P = U × I. Calculer P pour U = 230${NB}V et I = 2${NB}A.`,[`P = 230 × 2 = 460${NB}W.`]]],p:`Dans ${FX(1,2)} × m × v${SQ}, seul v est au carré : on calcule v${SQ} avant de multiplier.`},a08:{m:["Somme ou différence : on met les fractions au même dénominateur, puis on ajoute ou on soustrait les numérateurs.","Produit : on multiplie les numérateurs entre eux et les dénominateurs entre eux.","Quotient : diviser par une fraction, c’est multiplier par son inverse.","Simplifier : on divise le numérateur et le dénominateur par un même nombre.","Fraction d’une quantité : on divise par le dénominateur, puis on multiplie par le numérateur."],x:[[`Calculer ${FX(2,3)} + ${FX(1,4)}.`,["Dénominateur commun : 12.",`${FX(2,3)} + ${FX(1,4)} = ${FX(8,12)} + ${FX(3,12)} = ${FX(11,12)}.`]],[`Calculer ${FX(5,6)} ${MINUS} ${FX(1,3)}.`,[`${FX(5,6)} ${MINUS} ${FX(2,6)} = ${FX(3,6)} = ${FX(1,2)}.`]],[`Calculer ${FX(3,4)} × ${FX(2,5)}.`,[`${FX("3 × 2","4 × 5")} = ${FX(6,20)} = ${FX(3,10)}.`]],[`Calculer ${FX(2,3)} ÷ ${FX(5,7)}.`,[`${FX(2,3)} × ${FX(7,5)} = ${FX(14,15)}.`]],[`Calculer ${FX(3,5)} de 40.`,["40 ÷ 5 = 8, puis 8 × 3 = 24."]],[`Donner la forme irréductible de ${FX(12,18)}.`,[`12 et 18 sont divisibles par 6 : ${FX(12,18)} = ${FX(2,3)}.`]]],p:`${FX(1,2)} + ${FX(1,3)} ne vaut pas ${FX(2,5)} : on n’additionne jamais les dénominateurs.`},a09:{m:["Deux fractions de même dénominateur : la plus grande est celle qui a le plus grand numérateur.","Sinon, on les met au même dénominateur avant de comparer.","Une fraction est supérieure à 1 quand son numérateur est plus grand que son dénominateur.","Pour comparer une fraction et un nombre décimal, on écrit la fraction sous forme décimale."],x:[[`Comparer ${FX(3,4)} et ${FX(5,8)}.`,[`${FX(3,4)} = ${FX(6,8)}.`,`6 ${GT} 5, donc ${FX(3,4)} ${GT} ${FX(5,8)}.`]],[`Comparer ${FX(2,5)} et 0,5.`,[`${FX(2,5)} = 0,4.`,`0,4 ${LT} 0,5, donc ${FX(2,5)} ${LT} 0,5.`]],[`${FX(7,6)} et ${FX(5,9)} sont-elles supérieures à 1 ?`,[`7 ${GT} 6, donc ${FX(7,6)} ${GT} 1.`,`5 ${LT} 9, donc ${FX(5,9)} ${LT} 1.`]],[`Ranger dans l’ordre croissant ${FX(3,4)}, ${FX(1,2)} et ${FX(2,3)}.`,[`Dénominateur commun 12 : ${FX(9,12)}, ${FX(6,12)} et ${FX(8,12)}.`,`${FX(1,2)} ${LT} ${FX(2,3)} ${LT} ${FX(3,4)}.`]]],p:`Un plus grand dénominateur ne donne pas une plus grande fraction : ${FX(1,8)} ${LT} ${FX(1,4)}.`},a11:{m:["On remplace x par l’abscisse du point (le premier nombre) dans l’équation.","On calcule.","Si le résultat est égal à l’ordonnée du point (le second nombre), le point appartient à la courbe. Sinon, il n’y appartient pas."],x:[[`Le point A(2 ; 5) appartient-il à la droite d’équation y = 3x ${MINUS} 1 ?`,[`Pour x = 2 : 3 × 2 ${MINUS} 1 = 5.`,"C’est l’ordonnée de A : oui, A appartient à la droite."]],[`Le point B(${MINUS}1 ; 4) appartient-il à la droite d’équation y = 2x + 3 ?`,[`Pour x = ${MINUS}1 : 2 × (${MINUS}1) + 3 = 1.`,"1 n’est pas égal à 4 : non, B n’appartient pas à la droite."]],[`Le point C(${MINUS}2 ; 3) appartient-il à la courbe d’équation y = x${SQ} ${MINUS} 1 ?`,[`Pour x = ${MINUS}2 : (${MINUS}2)${SQ} ${MINUS} 1 = 4 ${MINUS} 1 = 3.`,"Oui, C appartient à la courbe."]]],p:"C’est l’abscisse que l’on remplace dans l’équation, pas l’ordonnée."},a16:{m:[`t${NB}% d’une quantité vaut ${FX("t",100)} × quantité.`,`Proportion = ${FX("partie","tout")}. On la multiplie par 100 pour l’écrire en pourcentage.`,"Un pourcentage d’un pourcentage : on multiplie les deux proportions.",`Pour retrouver le tout, on passe par 10${NB}% ou 1${NB}%, puis on remonte à 100${NB}%.`,`À connaître : 50${NB}% est la moitié, 25${NB}% le quart, 10${NB}% le dixième.`],x:[[`Calculer 30${NB}% de 200.`,["0,3 × 200 = 60."]],["Dans une classe de 40 élèves, 12 font de l’espagnol. Quel pourcentage cela représente-t-il ?",[`${FX(12,40)} = ${FX(3,10)} = 0,3 = 30${NB}%.`]],[`40${NB}% des adhérents d’un club sont des jeunes et 50${NB}% de ces jeunes sont des filles. Quel pourcentage des adhérents sont des jeunes filles ?`,[`50${NB}% de 40${NB}% : 0,5 × 40${NB}% = 20${NB}%.`]],[`20${NB}% d’une somme valent 30${NB}€. Quelle est cette somme ?`,[`10${NB}% valent 15${NB}€.`,`100${NB}% valent 150${NB}€.`]],[`Écrire ${FX(3,4)} en pourcentage.`,[`${FX(3,4)} = 0,75 = 75${NB}%.`]]],p:`Dans ${FX("partie","tout")}, on divise par l’effectif total, pas par l’autre partie.`},a17:{m:["Dans y = mx + p, m est le coefficient directeur et p l’ordonnée à l’origine.","Pour tracer la droite : on place le point (0 ; p), puis on avance de 1 vers la droite et on monte de m (on descend si m est négatif). On relie les deux points.",`Avec deux points A et B : m = ${FX("y<sub>B</sub> "+MINUS+" y<sub>A</sub>","x<sub>B</sub> "+MINUS+" x<sub>A</sub>")}.`,"Si m est positif, la droite monte : la fonction est croissante. Si m est négatif, elle descend : la fonction est décroissante."],x:[[`Tracer la droite d’équation y = 2x ${MINUS} 1.`,[`p = ${MINUS}1 : la droite passe par (0 ; ${MINUS}1).`,"m = 2 : on avance de 1 et on monte de 2, on arrive en (1 ; 1).","@fig1"]],["La droite (AB) passe par A(1 ; 2) et B(3 ; 8). Quel est son coefficient directeur ?",[`m = ${FX("8 "+MINUS+" 2","3 "+MINUS+" 1")} = ${FX(6,2)} = 3.`]],[`Lire m et p pour la droite d’équation y = ${MINUS}3x + 4. La fonction est-elle croissante ?`,[`m = ${MINUS}3 et p = 4.`,"m est négatif : la fonction est décroissante."]]],p:"Dans la formule de m, les ordonnées sont au numérateur et les abscisses au dénominateur, dans le même ordre."},a18:{m:["On lit p : c’est l’ordonnée du point où la droite coupe l’axe des ordonnées.",`On choisit deux points de la droite placés sur des nœuds du quadrillage. m = ${FX("déplacement vertical","déplacement horizontal")}, en allant du point de gauche vers celui de droite.`,"On écrit l’équation y = mx + p."],x:[["Déterminer l’équation de la droite tracée.",["@fig2","La droite coupe l’axe des ordonnées en 1 : p = 1.",`De (0 ; 1) à (2 ; 2), on avance de 2 et on monte de 1 : m = ${FX(1,2)}.`,`Équation : y = ${FX(1,2)}x + 1.`]],["Déterminer l’équation de la droite tracée.",["@fig3","La droite coupe l’axe des ordonnées en 3 : p = 3.",`De (0 ; 3) à (1 ; 1), on avance de 1 et on descend de 2 : m = ${MINUS}2.`,`Équation : y = ${MINUS}2x + 3.`]]],p:"Une droite qui descend de gauche à droite a un coefficient directeur négatif."},a19:{m:[`On cherche la valeur qui annule l’expression : ax + b = 0 donne x = ${MINUS}${FX("b","a")}.`,"Si a est positif : l’expression est négative avant cette valeur et positive après.","Si a est négatif : c’est le contraire, positive avant et négative après.","Une fonction affine est croissante si a est positif, décroissante si a est négatif."],x:[[`Pour quelles valeurs de x a-t-on 2x ${MINUS} 6 ${GT} 0 ?`,[`2x ${MINUS} 6 = 0 pour x = 3.`,"a = 2 est positif : l’expression est positive après 3.",`2x ${MINUS} 6 ${GT} 0 pour x ${GT} 3.`]],[`Pour quelles valeurs de x a-t-on ${MINUS}x + 4 ${GT} 0 ?`,[`${MINUS}x + 4 = 0 pour x = 4.`,`a = ${MINUS}1 est négatif : l’expression est positive avant 4.`,`${MINUS}x + 4 ${GT} 0 pour x ${LT} 4.`]],["Pour quelle valeur de x l’expression 3x + 5 est-elle nulle ?",[`3x = ${MINUS}5, donc x = ${MINUS}${FX(5,3)}.`]],[`La fonction f définie par f(x) = ${MINUS}2x + 7 est-elle croissante ?`,[`Le coefficient de x est ${MINUS}2, il est négatif : f est décroissante.`]]],p:`Le signe dépend du coefficient de x, pas du nombre seul : ${MINUS}x + 4 a un coefficient négatif.`},a21:{m:["a<sup>n</sup> × a<sup>p</sup> = a<sup>n + p</sup> : pour un produit, on additionne les exposants.",`${FX("a<sup>n</sup>","a<sup>p</sup>")} = a<sup>n ${MINUS} p</sup> : pour un quotient, on soustrait les exposants.`,"(a<sup>n</sup>)<sup>p</sup> = a<sup>n × p</sup> : pour une puissance de puissance, on multiplie les exposants.",`a<sup>${MINUS}n</sup> = ${FX(1,"a<sup>n</sup>")} : un exposant négatif donne l’inverse. Et a<sup>0</sup> = 1.`],x:[["Écrire 10<sup>3</sup> × 10<sup>4</sup> sous la forme d’une seule puissance.",["10<sup>3 + 4</sup> = 10<sup>7</sup>."]],[`Simplifier ${FX("5<sup>6</sup>","5<sup>2</sup>")}.`,[`5<sup>6 ${MINUS} 2</sup> = 5<sup>4</sup>.`]],["Écrire (2<sup>3</sup>)<sup>2</sup> sous la forme d’une seule puissance, puis calculer.",["2<sup>3 × 2</sup> = 2<sup>6</sup> = 64."]],[`Écrire 2<sup>${MINUS}3</sup> sous la forme d’une fraction.`,[`2<sup>${MINUS}3</sup> = ${FX(1,"2<sup>3</sup>")} = ${FX(1,8)}.`]],["Calculer 3<sup>4</sup>.",["3 × 3 × 3 × 3 = 81."]]],p:"3<sup>4</sup> n’est pas 3 × 4 : l’exposant compte le nombre de facteurs."},a22:{m:["On fait la même opération des deux côtés de l’égalité.","On « défait » les opérations dans l’ordre inverse : d’abord les additions et soustractions, ensuite les multiplications et divisions.","Si la lettre cherchée est au dénominateur, on commence par multiplier les deux côtés par elle."],x:[[`v = ${FX("d","t")}. Exprimer d en fonction de v et t.`,["On multiplie les deux côtés par t : d = v × t."]],[`v = ${FX("d","t")}. Exprimer t en fonction de d et v.`,["v × t = d.",`On divise par v : t = ${FX("d","v")}.`]],["U = R × I. Exprimer I en fonction de U et R.",[`On divise par R : I = ${FX("U","R")}.`]],["y = 3x + 2. Exprimer x en fonction de y.",[`y ${MINUS} 2 = 3x.`,`x = ${FX("y "+MINUS+" 2",3)}.`]]],p:"Dans y = 3x + 2, on enlève d’abord 2, puis on divise tout le côté gauche par 3."},a23:{m:["On arrondit chaque nombre à une valeur simple, proche, avec un seul chiffre autre que zéro.","On fait le calcul de tête avec ces valeurs.","Le résultat n’est pas exact : il donne la taille du résultat et permet de repérer une réponse absurde."],x:[["Donner un ordre de grandeur de 49 × 21.",["49 est proche de 50 et 21 de 20.",`50 × 20 = 1${NN}000.`]],["Donner un ordre de grandeur de 802 ÷ 3,96.",["802 est proche de 800 et 3,96 de 4.","800 ÷ 4 = 200."]],[`Donner un ordre de grandeur de 19${NB}% de 498.`,[`19${NB}% est proche de 20${NB}% et 498 de 500.`,`20${NB}% de 500 = 100.`]]],p:"On arrondit avant de calculer, pas après : le but est un calcul faisable de tête."},a24:{m:[`On regroupe les termes de même nature : les x${SQ} avec les x${SQ}, les x avec les x, les nombres avec les nombres.`,`Un signe ${MINUS} devant une parenthèse change tous les signes à l’intérieur.`,`Dans un produit, on multiplie les nombres entre eux et les lettres entre elles : x × x = x${SQ}.`],x:[[`Réduire 3x + 5 + 2x ${MINUS} 7.`,[`(3x + 2x) + (5 ${MINUS} 7) = 5x ${MINUS} 2.`]],[`Réduire 4x ${MINUS} (x ${MINUS} 3).`,[`4x ${MINUS} x + 3 = 3x + 3.`]],[`Réduire 2x${SQ} + 3x ${MINUS} x${SQ} + x.`,[`(2x${SQ} ${MINUS} x${SQ}) + (3x + x) = x${SQ} + 4x.`]],["Réduire 3x × 4x.",[`3 × 4 × x × x = 12x${SQ}.`]]],p:"3x + 2 ne se réduit pas : on n’ajoute pas des x et des nombres. Ce n’est pas 5x."},a25:{m:["On procède comme pour une équation : on regroupe les x d’un côté, les nombres de l’autre.","Quand on multiplie ou divise les deux côtés par un nombre négatif, on change le sens de l’inégalité.","Ajouter ou soustraire un nombre ne change jamais le sens."],x:[[`Résoudre 2x + 3 ${LT} 11.`,[`2x ${LT} 8.`,`On divise par 2, positif : x ${LT} 4.`]],[`Résoudre ${MINUS}3x + 1 ${GE} 10.`,[`${MINUS}3x ${GE} 9.`,`On divise par ${MINUS}3, négatif : le sens change.`,`x ${LE} ${MINUS}3.`]],[`Résoudre 5x ${MINUS} 2 ${GT} 3x + 6.`,[`5x ${MINUS} 3x ${GT} 6 + 2.`,`2x ${GT} 8, donc x ${GT} 4.`]],[`Résoudre 4x + 3 ${LE} 0.`,[`4x ${LE} ${MINUS}3.`,`x ${LE} ${MINUS}${FX(3,4)}.`]]],p:"Le sens change seulement quand on divise ou multiplie par un nombre négatif, pas quand le résultat est négatif."},a26:{m:["Fraction vers décimal : on divise le numérateur par le dénominateur.","Décimal vers pourcentage : on multiplie par 100. Pourcentage vers décimal : on divise par 100.","Écriture scientifique : a × 10<sup>n</sup> avec a compris entre 1 et 10 (10 exclu).",`10<sup>n</sup> s’écrit avec un 1 suivi de n zéros. 10<sup>${MINUS}n</sup> s’écrit avec le 1 à la n-ième place après la virgule.`,`À connaître : ${FX(1,2)} = 0,5 ; ${FX(1,4)} = 0,25 ; ${FX(3,4)} = 0,75 ; ${FX(1,5)} = 0,2 ; ${FX(1,10)} = 0,1.`],x:[[`Écrire ${FX(3,4)} sous forme décimale, puis en pourcentage.`,["3 ÷ 4 = 0,75.",`0,75 = 75${NB}%.`]],["Écrire 0,2 sous la forme d’une fraction irréductible.",[`0,2 = ${FX(2,10)} = ${FX(1,5)}.`]],[`Donner l’écriture scientifique de 45${NN}000.`,[`45${NN}000 = 4,5 × 10${NN}000 = 4,5 × 10<sup>4</sup>.`]],["Donner l’écriture scientifique de 0,0032.",[`La virgule se déplace de 3 rangs vers la droite : 0,0032 = 3,2 × 10<sup>${MINUS}3</sup>.`]],[`Donner l’écriture décimale de 10<sup>${MINUS}3</sup>.`,[`10<sup>${MINUS}3</sup> = ${FX(1,"1 000")} = 0,001.`]],[`Écrire 7${NB}% sous forme décimale.`,["7 ÷ 100 = 0,07."]]],p:`7${NB}% s’écrit 0,07 et non 0,7 : 0,7 correspond à 70${NB}%.`},a27:{m:["Un produit est nul si, et seulement si, l’un de ses facteurs est nul.","On écrit chaque facteur égal à 0 et on résout les deux petites équations.","L’équation a en général deux solutions."],x:[[`Résoudre (x ${MINUS} 2)(x + 5) = 0.`,[`x ${MINUS} 2 = 0 ou x + 5 = 0.`,`x = 2 ou x = ${MINUS}5.`]],[`Résoudre (2x ${MINUS} 6)(x + 1) = 0.`,[`2x ${MINUS} 6 = 0 donne x = 3.`,`x + 1 = 0 donne x = ${MINUS}1.`,`Les solutions sont 3 et ${MINUS}1.`]],[`Résoudre x(3x ${MINUS} 4) = 0.`,[`x = 0 ou 3x ${MINUS} 4 = 0.`,`Les solutions sont 0 et ${FX(4,3)}.`]]],p:"On ne développe surtout pas : la forme factorisée donne directement les solutions."},a28:{m:["k(a + b) = ka + kb : le nombre devant la parenthèse multiplie chaque terme.","(a + b)(c + d) = ac + ad + bc + bd : chaque terme de la première parenthèse multiplie chaque terme de la seconde.",`(a + b)${SQ} = a${SQ} + 2ab + b${SQ} et (a ${MINUS} b)${SQ} = a${SQ} ${MINUS} 2ab + b${SQ}.`,`(a + b)(a ${MINUS} b) = a${SQ} ${MINUS} b${SQ}.`,"On termine en réduisant."],x:[[`Développer 3(2x ${MINUS} 5).`,[`3 × 2x ${MINUS} 3 × 5 = 6x ${MINUS} 15.`]],["Développer 2x(x + 4).",[`2x × x + 2x × 4 = 2x${SQ} + 8x.`]],[`Développer et réduire (x + 3)(x ${MINUS} 2).`,[`x${SQ} ${MINUS} 2x + 3x ${MINUS} 6`,`= x${SQ} + x ${MINUS} 6.`]],[`Développer (x + 4)${SQ}.`,[`x${SQ} + 2 × x × 4 + 4${SQ} = x${SQ} + 8x + 16.`]],[`Développer (x ${MINUS} 3)${SQ}.`,[`x${SQ} ${MINUS} 2 × x × 3 + 3${SQ} = x${SQ} ${MINUS} 6x + 9.`]],[`Développer (x + 5)(x ${MINUS} 5).`,[`x${SQ} ${MINUS} 5${SQ} = x${SQ} ${MINUS} 25.`]]],p:`(x + 4)${SQ} n’est pas x${SQ} + 16 : il manque le double produit 8x.`},a29:{m:[`Une hausse de t${NB}% correspond au coefficient multiplicateur 1 + ${FX("t",100)}.`,`Une baisse de t${NB}% correspond au coefficient multiplicateur 1 ${MINUS} ${FX("t",100)}.`,`Dans l’autre sens : taux = (coefficient ${MINUS} 1) × 100. Un coefficient supérieur à 1 est une hausse, inférieur à 1 une baisse.`],x:[[`Quel coefficient multiplicateur correspond à une hausse de 15${NB}% ?`,["1 + 0,15 = 1,15."]],[`Quel coefficient multiplicateur correspond à une baisse de 20${NB}% ?`,[`1 ${MINUS} 0,20 = 0,8.`]],["Quelle évolution correspond au coefficient multiplicateur 1,3 ?",[`1,3 ${MINUS} 1 = 0,3 : c’est une hausse de 30${NB}%.`]],["Quelle évolution correspond au coefficient multiplicateur 0,75 ?",[`0,75 ${MINUS} 1 = ${MINUS}0,25 : c’est une baisse de 25${NB}%.`]],[`Quel coefficient multiplicateur correspond à une hausse de 100${NB}% ?`,["1 + 1 = 2 : la valeur double."]]],p:`Une baisse de 20${NB}% donne 0,8 et non 0,2 : multiplier par 0,2, c’est baisser de 80${NB}%.`},a31:{m:[`Taux d’évolution = ${FX("valeur finale "+MINUS+" valeur initiale","valeur initiale")}.`,"On multiplie par 100 pour l’écrire en pourcentage.","Un taux positif est une hausse, un taux négatif une baisse."],x:[[`Un prix passe de 50${NB}€ à 60${NB}€. Quel est le taux d’évolution ?`,[`${FX("60 "+MINUS+" 50",50)} = ${FX(10,50)} = 0,2.`,`Le prix augmente de 20${NB}%.`]],["Un effectif passe de 80 à 60. Quel est le taux d’évolution ?",[`${FX("60 "+MINUS+" 80",80)} = ${FX(MINUS+"20",80)} = ${MINUS}0,25.`,`L’effectif baisse de 25${NB}%.`]],["Un nombre d’abonnés passe de 200 à 300. Quel est le taux d’évolution ?",[`${FX("300 "+MINUS+" 200",200)} = ${FX(100,200)} = 0,5, soit +50${NB}%.`]]],p:"On divise toujours par la valeur de départ, jamais par la valeur d’arrivée."},a32:{m:["On écrit le coefficient multiplicateur de chaque évolution.","On multiplie ces coefficients : on obtient le coefficient global.",`On traduit le coefficient global en taux : (coefficient ${MINUS} 1) × 100.`],x:[[`Un prix augmente de 10${NB}%, puis de 20${NB}%. Quelle est l’évolution globale ?`,["1,1 × 1,2 = 1,32.",`Hausse globale de 32${NB}%.`]],[`Un prix augmente de 50${NB}%, puis baisse de 50${NB}%. Quelle est l’évolution globale ?`,["1,5 × 0,5 = 0,75.",`Baisse globale de 25${NB}% : le prix ne revient pas à son niveau de départ.`]],[`Un prix baisse deux fois de suite de 10${NB}%. Quel est le coefficient multiplicateur global ?`,["0,9 × 0,9 = 0,81.",`Cela correspond à une baisse de 19${NB}%.`]]],p:`On n’additionne jamais les taux : +10${NB}% puis +20${NB}% ne font pas +30${NB}%.`},a34:{m:["On écrit le coefficient multiplicateur de l’évolution de départ.",`Le coefficient de l’évolution réciproque est son inverse : ${FX(1,"coefficient")}.`,"On traduit ce coefficient en taux."],x:[[`Un prix augmente de 25${NB}%. Quelle évolution le ramène à sa valeur de départ ?`,["Coefficient : 1,25.",`${FX(1,"1,25")} = 0,8.`,`Il faut une baisse de 20${NB}%.`]],[`Un prix baisse de 50${NB}%. Quelle évolution le ramène à sa valeur de départ ?`,["Coefficient : 0,5.",`${FX(1,"0,5")} = 2.`,`Il faut une hausse de 100${NB}%.`]],[`Un prix baisse de 20${NB}%. Quelle évolution le ramène à sa valeur de départ ?`,["Coefficient : 0,8.",`${FX(1,"0,8")} = 1,25.`,`Il faut une hausse de 25${NB}%.`]]],p:`Après une hausse de 25${NB}%, une baisse de 25${NB}% ne ramène pas au départ : 1,25 × 0,75 = 0,9375.`},a39:{m:[`On calcule le coefficient directeur : m = ${FX("y<sub>B</sub> "+MINUS+" y<sub>A</sub>","x<sub>B</sub> "+MINUS+" x<sub>A</sub>")}.`,"On écrit y = mx + p, puis on remplace x et y par les coordonnées d’un des deux points pour trouver p.","On écrit l’équation réduite et on la vérifie avec l’autre point."],x:[["Déterminer l’équation réduite de la droite passant par A(1 ; 3) et B(3 ; 7).",[`m = ${FX("7 "+MINUS+" 3","3 "+MINUS+" 1")} = ${FX(4,2)} = 2.`,"Avec A : 3 = 2 × 1 + p, donc p = 1.","Équation : y = 2x + 1.","Vérification avec B : 2 × 3 + 1 = 7."]],["Déterminer l’équation réduite de la droite passant par A(0 ; 4) et B(2 ; 0).",[`m = ${FX("0 "+MINUS+" 4","2 "+MINUS+" 0")} = ${MINUS}2.`,"A est sur l’axe des ordonnées : p = 4.",`Équation : y = ${MINUS}2x + 4.`]],["Une droite a pour coefficient directeur 3 et passe par A(2 ; 1). Quelle est son ordonnée à l’origine ?",["y = 3x + p et A est sur la droite : 1 = 3 × 2 + p.",`p = 1 ${MINUS} 6 = ${MINUS}5.`]]],p:`Soustraire un nombre négatif, c’est ajouter : 3 ${MINUS} (${MINUS}2) = 5.`}};FICHES.c1={parts:[{t:"Multiplier ou diviser par 10, 100 ou 1 000",r:[`Multiplier par 10, 100 ou 1${NN}000 : la virgule avance de 1, 2 ou 3 rangs vers la droite.`,`Diviser par 10, 100 ou 1${NN}000 : la virgule recule de 1, 2 ou 3 rangs vers la gauche. On ajoute des zéros si besoin.`,"Multiplier par 0,1 ou par 0,01, c’est diviser par 10 ou par 100."],x:[["Calculer 4,5 × 100.",["La virgule avance de 2 rangs : 4,5 × 100 = 450."]],[`Calculer ${FX(37,"1 000")}.`,[`La virgule recule de 3 rangs : ${FX(37,"1 000")} = 0,037.`]],["Calculer 52 × 0,01.",[`52 × 0,01 = ${FX(52,100)} = 0,52.`]]]},{t:"Multiplier deux nombres décimaux",r:["On multiplie les deux nombres sans s’occuper des virgules.","Puis on place la virgule : le résultat a autant de chiffres après la virgule que les deux nombres réunis."],x:[["Calculer 3,2 × 0,4.",["32 × 4 = 128.","1 chiffre après la virgule dans 3,2 et 1 dans 0,4 : 2 en tout.","3,2 × 0,4 = 1,28."]],["Calculer 0,06 × 0,3.",["6 × 3 = 18.","2 chiffres après la virgule dans 0,06 et 1 dans 0,3 : 3 en tout.","0,06 × 0,3 = 0,018."]],["Calculer 2,5 × 0,4.",["25 × 4 = 100.","2 chiffres après la virgule en tout : 2,5 × 0,4 = 1,00 = 1."]]]},{t:"Diviser un nombre décimal par un entier",r:["On écrit l ,25 = 80 + 20 = 100."]]]}],p:`Multiplier par un nombre plus petit que 1 donne un résultat plus petit ; diviser par un nombre plus petit que 1 donne un résultat plus grand. ${FX(12,"0,25")} vaut 48, et non 3.`};const KNOWN=[[1,2,"0,5"],[1,4,"0,25"],[3,4,"0,75"],[1,5,"0,2"],[1,8,"0,125"],[1,10,"0,1"],[1,20,"0,05"],[1,25,"0,04"],[1,50,"0,02"]];FICHES.c2={parts:[{t:"Fraction de dénominateur 10, 100 ou 1 000",r:[`On lit directement l’écriture décimale : le dénominateur 10, 100 ou 1${NN}000 donne 1, 2 ou 3 chiffres après la virgule.`],x:[[`Écrire ${FX(7,10)} et ${FX(23,100)} sous forme décimale.`,[`${FX(7,10)} = 0,7 et ${FX(23,100)} = 0,23.`]],[`Écrire ${FX(9,100)} et ${FX(125,"1 000")} sous forme décimale.`,[`${FX(9,100)} = 0,09 : il faut 2 chiffres après la virgule.`,`${FX(125,"1 000")} = 0,125.`]]]},{t:"Se ramener à 10, 100 ou 1 000",r:[`On multiplie le numérateur et le dénominateur par un même nombre pour obtenir 10, 100 ou 1${NN}000 au dénominateur.`,`Dénominateur 2 ou 5 : on vise 10. Dénominateur 4, 20, 25 ou 50 : on vise 100. Dénominateur 8 : on vise 1${NN}000.`],x:[[`Écrire ${FX(3,5)} sous forme décimale.`,[`${FX(3,5)} = ${FX("3 × 2","5 × 2")} = ${FX(6,10)} = 0,6.`]],[`Écrire ${FX(7,20)} sous forme décimale.`,[`${FX(7,20)} = ${FX("7 × 5","20 × 5")} = ${FX(35,100)} = 0,35.`]],[`Écrire ${FX(9,25)} sous forme décimale.`,[`${FX(9,25)} = ${FX("9 × 4","25 × 4")} = ${FX(36,100)} = 0,36.`]],[`Écrire ${FX(3,8)} sous forme décimale.`,[`${FX(3,8)} = ${FX("3 × 125","8 × 125")} = ${FX(375,"1 000")} = 0,375.`]]]},{t:"Les fractions à connaître",r:[`<div class="kgrid">${KNOWN.map(e=>`<span class="m">${FX(e[0],e[1])} = ${e[2]}</span>`).join("")}</div>`,`On s’en sert pour aller plus vite : ${FX(3,8)} = 3 × ${FX(1,8)} = 3 × 0,125.`],x:[[`Écrire ${FX(3,8)} sous forme décimale.`,[`${FX(3,8)} = 3 × 0,125 = 0,375.`]],[`Écrire ${FX(2,5)} sous forme décimale.`,[`${FX(2,5)} = 2 × 0,2 = 0,4.`]]]},{t:"Fraction plus grande que 1",r:["On sépare la partie entière : on enlève au numérateur le pl
